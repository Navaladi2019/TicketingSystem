; T11 isolation suite (make isolation, scripts/ci/isolation.sh): the pooler
; the runtime roles reach the platform database through. Same mode,
; prepared-statement setting and auth_query as
; deploy/compose/pgbouncer/pgbouncer.ini, with one server connection per role
; so the CI-2 "prior SET LOCAL" case always lands on the backend that set it.
[databases]
nava = host=pg port=5432 dbname=nava

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
pool_mode = transaction
max_prepared_statements = 100
default_pool_size = 1
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 100
ignore_startup_parameters = extra_float_digits

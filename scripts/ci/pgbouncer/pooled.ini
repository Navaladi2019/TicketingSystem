; T06 load test (internal/db/pooltest): the pooler under test. Same mode and
; prepared-statement setting as deploy/compose/pgbouncer/pgbouncer.ini, with a
; pool of 5 so 50 clients must share server connections.
; scripts/ci/test-integration.sh copies this into the container.
[databases]
nava_it_pool = host=pg port=5432 dbname=nava_it_pool

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 100
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 100
ignore_startup_parameters = extra_float_digits
stats_users = nava_it_pool
; SHOW STATS averages refresh every stats_period; the test polls them.
stats_period = 2

; T06 load test (internal/db/pooltest): the negative case. Identical to
; pooled.ini except max_prepared_statements = 0, so PgBouncer does not track
; prepared statements and the same load must fail.
; scripts/ci/test-integration.sh copies this into the container.
[databases]
nava_it_pool = host=pg port=5432 dbname=nava_it_pool

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 5
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 100
ignore_startup_parameters = extra_float_digits
stats_users = nava_it_pool
; SHOW STATS averages refresh every stats_period; the test polls them.
stats_period = 2

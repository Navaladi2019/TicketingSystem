# Local platform stack: `docker compose up` from a fresh clone (or `task stack:up`).
# Every image tag is pinned exactly (D-P3, ADR-001 section 3); never use `latest`.
# Passwords below are dev-only defaults so a fresh clone needs no setup. Override
# them in .env (gitignored). The Postgres superuser password reaches only the
# postgres and db-roles containers, as a file under /run, never as an
# environment variable.
#
# The superuser logs in only over PostgreSQL's Unix socket (db/pg_hba.conf),
# which only postgres and db-roles mount (the `pgsocket` volume); db-roles has
# no network at all.
#
# Networks: `internal` (internal: true, no egress) carries every backing
# service and is the platform network. `default` publishes ports to the host for
# nava-core and Keycloak. `temporal-backplane` carries Temporal's own traffic and
# `operator` the Temporal UI (see the temporal services).
# deploy/compose/compose.internal.yaml makes `default` and `operator` internal too.
#
# Several stacks on one host (`make ci-isolated`, TICK-147): COMPOSE_PROJECT_NAME
# overrides the project name, NAVA_IMAGE_TAG the tag of the nava/* images, and
# NAVA_CORE_PORT, KEYCLOAK_PORT and TEMPORAL_TEST_PORT the host ports.
name: nava

services:
  postgres:
    image: postgres:16.10
    # db/pg_hba.conf replaces the image's file, which trusts the socket and
    # lets every role in, the superuser included, from any container.
    # TICK-166: no durability, as in compose.ci.yaml. Keycloak's first-boot
    # schema init and realm import are fsync-bound. Dev data is disposable
    # (`down -v`); a host crash can corrupt this volume, so reset it then.
    # The flags are runtime settings, so an existing dev volume gets them too.
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf",
              "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_INITDB_ARGS: --no-sync
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD_FILE: /run/pg_superuser_password
      POSTGRES_DB: postgres
    configs:
      - source: pg_superuser_password
        target: /run/pg_superuser_password
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    networks: [internal, temporal-backplane]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot and idempotent, as the bootstrap superuser (the only service
  # that has its credential): converges every role in db/grants.yaml (no
  # SUPERUSER, CREATEDB, CREATEROLE or BYPASSRLS; no memberships), the
  # databases and their owners, the service databases' grants (owner only),
  # and PgBouncer's lookup function, then exits. It reaches PostgreSQL over
  # the Unix socket only, the one path pg_hba.conf opens to the superuser.
  db-roles:
    build:
      context: .
      dockerfile: deploy/compose/nava-db/Dockerfile
    image: nava/nava-db:${NAVA_IMAGE_TAG:-dev}
    command: ["roles"]
    environment:
      PGHOST: /var/run/postgresql
      PGUSER: pgadmin
      PGDATABASE: postgres
      PGPASSWORD_FILE: /run/pg_superuser_password
      DBROLES_PASSWORD_NAVA_MIGRATOR: ${NAVA_MIGRATOR_DB_PASSWORD:-dev-only-migrator}
      DBROLES_PASSWORD_NAVA_APP: ${NAVA_APP_DB_PASSWORD:-dev-only-app}
      DBROLES_PASSWORD_NAVA_WORKER: ${NAVA_WORKER_DB_PASSWORD:-dev-only-worker}
      DBROLES_PASSWORD_NAVA_RELAY: ${NAVA_RELAY_DB_PASSWORD:-dev-only-relay}
      DBROLES_PASSWORD_NAVA_PURGE: ${NAVA_PURGE_DB_PASSWORD:-dev-only-purge}
      DBROLES_PASSWORD_NAVA_ONBOARD: ${NAVA_ONBOARD_DB_PASSWORD:-dev-only-onboard}
      DBROLES_PASSWORD_NAVA_GROUPSYNC: ${NAVA_GROUPSYNC_DB_PASSWORD:-dev-only-groupsync}
      DBROLES_PASSWORD_NAVA_BACKUP: ${NAVA_BACKUP_DB_PASSWORD:-dev-only-backup}
      DBROLES_PASSWORD_KEYCLOAK: ${KEYCLOAK_DB_PASSWORD:-dev-only-keycloak}
      DBROLES_PASSWORD_TEMPORAL: ${TEMPORAL_DB_PASSWORD:-dev-only-temporal}
      DBROLES_PASSWORD_PGBOUNCER_AUTH: ${PGBOUNCER_AUTH_PASSWORD:-dev-only-pgbouncer}
    configs:
      - source: pg_superuser_password
        target: /run/pg_superuser_password
    volumes:
      - pgsocket:/var/run/postgresql
    network_mode: none
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # One-shot: as nava_migrator, straight to PostgreSQL (never PgBouncer, which
  # refuses it), applies the migrations under goose's session lock, then
  # db/grants.yaml. nava-core never migrates.
  migrate:
    build:
      context: .
      dockerfile: deploy/compose/nava-db/Dockerfile
    image: nava/nava-db:${NAVA_IMAGE_TAG:-dev}
    command: ["migrate"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: nava_migrator
      PGPASSWORD_FILE: /run/nava_migrator_password
    configs:
      - source: nava_migrator_password
        target: /run/nava_migrator_password
    networks: [internal]
    depends_on:
      db-roles: {condition: service_completed_successfully}
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    configs:
      - source: pgbouncer_ini
        target: /etc/pgbouncer/pgbouncer.ini
      - source: pgbouncer_userlist
        target: /etc/pgbouncer/userlist.txt
    networks: [internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    build:
      context: .
      dockerfile: deploy/compose/keycloak/Dockerfile
    image: nava/keycloak:${NAVA_IMAGE_TAG:-dev}
    # T14: realm `nava` is imported from deploy/compose/keycloak/import;
    # existing realms are left alone. The two test IdP realms are not: each one
    # imported at first boot lengthened it (TICK-166); make stack-test-identity
    # imports them from deploy/compose/keycloak/test-realms.
    # TICK-156: `start --optimized` on an image built with `kc.sh build`.
    # What `start-dev` gave for free is set here on purpose: plain HTTP (the
    # published port and the internal network are not TLS) and no strict
    # hostname (the issuer follows the request host, as before). The proxy
    # headers stay off, as in dev. KC_CACHE=local (single node) is in the image.
    command: ["start", "--optimized", "--import-realm"]
    volumes:
      - ./deploy/compose/keycloak/import:/opt/keycloak/data/import:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-only-keycloak}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-only-admin}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-18081}:8080"
    networks: [default, internal]
    depends_on:
      db-roles: {condition: service_completed_successfully}
    healthcheck:
      # The image has no curl; probe the management port with bash. Ready is the
      # 200 status line: the body also holds per-check "status": "UP" lines (Graceful
      # Shutdown) while Keycloak is still initialising, and matched those (TICK-156).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Temporal (ADR-001 D22, T28). Three services share the nava/temporal-server
  # image (T27a); build it with `make temporal-server-image` or let `up --build`.
  #   temporal-schema  one-shot: schema in the temporal and temporal_visibility
  #                    databases (PostgreSQL direct, not PgBouncer).
  #   temporal-server  the server. Frontend and internode require client
  #                    certificates; internode has its own CA. Only this service
  #                    holds the temporal-system certificate: it registers
  #                    namespace `nava` and the NavaTenantId search attribute
  #                    itself (--bootstrap). It is on temporal-backplane only.
  #   temporal         the gateway: forwards TCP 7233 and nothing else, so the
  #                    internode (7234, 7235, 7239) and membership (6933-6939)
  #                    ports are unreachable from `internal`. It holds no
  #                    certificate; TLS is end to end. Platform processes dial
  #                    temporal:7233 with their own certificate.
  # The certificates come from `make dev-ca` (deploy/compose/certs/, git-ignored);
  # each is mounted only into the service that owns it.
  temporal-schema:
    image: nava/temporal-server:${NAVA_IMAGE_TAG:-dev}
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-schema.sh"]
    command: []
    environment:
      PG_HOST: postgres
      PG_USER: temporal
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-dev-only-temporal}
    networks: [temporal-backplane]
    depends_on:
      db-roles: {condition: service_completed_successfully}
    restart: "no"

  temporal-server:
    build:
      context: ./temporal-server
    image: nava/temporal-server:${NAVA_IMAGE_TAG:-dev}
    command: ["--env", "compose", "--bootstrap"]
    environment:
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-dev-only-temporal}
    volumes:
      - ./deploy/compose/temporal/config:/etc/temporal/config:ro
      - ./deploy/compose/certs/ca.pem:/etc/temporal/certs/ca.pem:ro
      - ./deploy/compose/certs/server.pem:/etc/temporal/certs/server.pem:ro
      - ./deploy/compose/certs/server.key:/etc/temporal/certs/server.key:ro
      - ./deploy/compose/certs/internode-ca.pem:/etc/temporal/certs/internode-ca.pem:ro
      - ./deploy/compose/certs/internode.pem:/etc/temporal/certs/internode.pem:ro
      - ./deploy/compose/certs/internode.key:/etc/temporal/certs/internode.key:ro
      - ./deploy/compose/certs/temporal-system.pem:/etc/temporal/certs/temporal-system.pem:ro
      - ./deploy/compose/certs/temporal-system.key:/etc/temporal/certs/temporal-system.key:ro
    networks: [temporal-backplane]
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    healthcheck:
      # Dials the frontend with the temporal-system certificate and requires the
      # nava namespace and NavaTenantId: healthy means bootstrapped.
      test: ["CMD", "/usr/local/bin/temporal-server", "health", "-bootstrapped"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  temporal:
    image: nava/temporal-server:${NAVA_IMAGE_TAG:-dev}
    entrypoint: ["/usr/local/bin/temporal-server", "proxy", "-listen", ":7233", "-to", "temporal-server:7233"]
    command: []
    networks: [internal, operator, temporal-backplane]
    depends_on:
      temporal-server: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/local/bin/temporal-server", "health", "-tcp-only", "-addr", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Temporal UI, on the operator network only, with the nava-operator
  # certificate. Off by default: `docker compose --profile operator up -d`. It
  # publishes no port (a published port is reachable from platform containers
  # through the host); reach it with `make operator-tunnel`.
  temporal-ui:
    profiles: [operator]
    image: temporalio/ui:2.40.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: nava
      TEMPORAL_TLS_CA: /run/certs/ca.pem
      TEMPORAL_TLS_CERT: /run/certs/nava-operator.pem
      TEMPORAL_TLS_KEY: /run/certs/nava-operator.key
      TEMPORAL_TLS_SERVER_NAME: temporal
    volumes:
      - ./deploy/compose/certs/ca.pem:/run/certs/ca.pem:ro
      - ./deploy/compose/certs/nava-operator.pem:/run/certs/nava-operator.pem:ro
      - ./deploy/compose/certs/nava-operator.key:/run/certs/nava-operator.key:ro
    networks: [operator]
    depends_on:
      temporal: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    build:
      context: ./deploy/compose/otel-collector
    image: nava/otel-collector:${NAVA_IMAGE_TAG:-dev}
    environment:
      # Share of ordinary traces kept; errors and slow requests are always kept.
      OTEL_TAIL_SAMPLE_PERCENT: ${OTEL_TAIL_SAMPLE_PERCENT:-10}
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nava-core:
    build:
      context: .
      dockerfile: deploy/compose/nava-core/Dockerfile
    image: nava/nava-core:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_HTTP_ADDR: ":8080"
      NAVA_KEYCLOAK_MANAGEMENT_URL: http://keycloak:9000
      NAVA_TEMPORAL_ADDRESS: temporal:7233
      # The nava-core certificate: the only one this service holds.
      NAVA_TEMPORAL_TLS_CERT_FILE: /run/temporal-tls/nava-core.pem
      NAVA_TEMPORAL_TLS_KEY_FILE: /run/temporal-tls/nava-core.key
      NAVA_TEMPORAL_TLS_CA_FILE: /run/temporal-tls/ca.pem
      NAVA_TEMPORAL_TLS_SERVER_NAME: temporal
      # nava_app (db/grants.yaml) through PgBouncer; PostgreSQL gates /readyz.
      NAVA_DATABASE_URL: postgres://nava_app:${NAVA_APP_DB_PASSWORD:-dev-only-app}@pgbouncer:5432/nava?sslmode=disable
      # Tenant access tokens (T17): the exact iss allow-list. Keycloak names
      # the issuer after the request host (KC_HOSTNAME_STRICT=false), so only
      # tokens fetched through http://keycloak:8080 match; keys come from that
      # issuer's own discovery document.
      NAVA_OIDC_ISSUERS: http://keycloak:8080/realms/nava
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-core
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./deploy/compose/certs/nava-core.pem:/run/temporal-tls/nava-core.pem:ro
      - ./deploy/compose/certs/nava-core.key:/run/temporal-tls/nava-core.key:ro
      - ./deploy/compose/certs/ca.pem:/run/temporal-tls/ca.pem:ro
    ports:
      - "127.0.0.1:${NAVA_CORE_PORT:-18080}:8080"
    networks: [default, internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      temporal: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
    healthcheck:
      # /readyz on the admin listener (NAVA_ADMIN_ADDR, :9090): 200 only while
      # PostgreSQL answers. The admin port is never published.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The Temporal worker (T31b): namespace nava, task queue nava-tq, with the
  # T31 guards. On `internal` only, so it publishes nothing and has no egress.
  # /metrics, /healthz and /readyz are on its admin listener (NAVA_ADMIN_ADDR,
  # :9090), never published.
  nava-worker:
    build:
      context: .
      dockerfile: deploy/compose/nava-worker/Dockerfile
    image: nava/nava-worker:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_TEMPORAL_ADDRESS: temporal:7233
      # The nava-worker certificate: the only one this service holds.
      NAVA_TEMPORAL_TLS_CERT_FILE: /run/temporal-tls/nava-worker.pem
      NAVA_TEMPORAL_TLS_KEY_FILE: /run/temporal-tls/nava-worker.key
      NAVA_TEMPORAL_TLS_CA_FILE: /run/temporal-tls/ca.pem
      NAVA_TEMPORAL_TLS_SERVER_NAME: temporal
      # nava_worker (db/grants.yaml) through PgBouncer, for the workflow_ref
      # activity. PostgreSQL and Temporal both gate /readyz.
      NAVA_DATABASE_URL: postgres://nava_worker:${NAVA_WORKER_DB_PASSWORD:-dev-only-worker}@pgbouncer:5432/nava?sslmode=disable
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./deploy/compose/certs/nava-worker.pem:/run/temporal-tls/nava-worker.pem:ro
      - ./deploy/compose/certs/nava-worker.key:/run/temporal-tls/nava-worker.key:ro
      - ./deploy/compose/certs/ca.pem:/run/temporal-tls/ca.pem:ro
    networks: [internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      temporal: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nava-relay:
    build:
      context: .
      dockerfile: deploy/compose/nava-relay/Dockerfile
    image: nava/nava-relay:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_TEMPORAL_ADDRESS: temporal:7233
      # The nava-relay certificate: the only one this service holds.
      NAVA_TEMPORAL_TLS_CERT_FILE: /run/temporal-tls/nava-relay.pem
      NAVA_TEMPORAL_TLS_KEY_FILE: /run/temporal-tls/nava-relay.key
      NAVA_TEMPORAL_TLS_CA_FILE: /run/temporal-tls/ca.pem
      NAVA_TEMPORAL_TLS_SERVER_NAME: temporal
      # nava_relay (db/grants.yaml) through PgBouncer: every tenant's pending
      # outbox rows, dispatch columns only. PostgreSQL and Temporal both gate
      # /readyz.
      NAVA_DATABASE_URL: postgres://nava_relay:${NAVA_RELAY_DB_PASSWORD:-dev-only-relay}@pgbouncer:5432/nava?sslmode=disable
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-relay
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./deploy/compose/certs/nava-relay.pem:/run/temporal-tls/nava-relay.pem:ro
      - ./deploy/compose/certs/nava-relay.key:/run/temporal-tls/nava-relay.key:ro
      - ./deploy/compose/certs/ca.pem:/run/temporal-tls/ca.pem:ro
    networks: [internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      temporal: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The retention purge (T13): deletes expired idempotency_keys, outbox and
  # workflow_ref rows as nava_purge (db/grants.yaml) through PgBouncer. It does
  # not use Temporal, so it holds no certificate. On `internal` only; /readyz
  # (PostgreSQL) is on its admin listener (NAVA_ADMIN_ADDR, :9090), never published.
  nava-purge:
    build:
      context: .
      dockerfile: deploy/compose/nava-purge/Dockerfile
    image: nava/nava-purge:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_DATABASE_URL: postgres://nava_purge:${NAVA_PURGE_DB_PASSWORD:-dev-only-purge}@pgbouncer:5432/nava?sslmode=disable
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-purge
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The operator onboarding API (T21, TICK-234): POST /api/v1/operator/tenants
  # on :8081, in its own process and container. It is the only service that
  # holds the onboarding account's secret and the nava_onboard database URL;
  # nava-core holds neither and answers the operator routes 501. On `internal`
  # only and never published, so the tenant ingress (nava-core's port) cannot
  # reach it; reach it with `docker compose exec`. Its admin listener (:9090)
  # serves /metrics, /healthz and /readyz.
  nava-onboard:
    build:
      context: .
      dockerfile: deploy/compose/nava-onboard/Dockerfile
    image: nava/nava-onboard:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_ONBOARD_ADDR: ":8081"
      # nava_app for the token checks and the invite's registry reads,
      # nava_onboard for the onboarding writes; both through PgBouncer.
      NAVA_DATABASE_URL: postgres://nava_app:${NAVA_APP_DB_PASSWORD:-dev-only-app}@pgbouncer:5432/nava?sslmode=disable
      NAVA_ONBOARD_DATABASE_URL: postgres://nava_onboard:${NAVA_ONBOARD_DB_PASSWORD:-dev-only-onboard}@pgbouncer:5432/nava?sslmode=disable
      NAVA_OIDC_ISSUERS: http://keycloak:8080/realms/nava
      NAVA_ONBOARD_ISSUER: http://keycloak:8080/realms/nava
      # operator@nava.test, the realm export's only nava-operator (fixed id).
      NAVA_OPERATORS: http://keycloak:8080/realms/nava|00000000-0000-4000-8000-00000000f001
      NAVA_KEYCLOAK_URL: http://keycloak:8080
      NAVA_KEYCLOAK_REALM: nava
      NAVA_DIRECTORY_CLIENT_ID: nava-platform
      NAVA_DIRECTORY_CLIENT_SECRET: ${NAVA_PLATFORM_CLIENT_SECRET:-dev-only-platform-secret}
      NAVA_ONBOARD_CLIENT_ID: nava-onboarding
      NAVA_ONBOARD_CLIENT_SECRET: ${NAVA_ONBOARD_CLIENT_SECRET:-dev-only-onboarding-secret}
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-onboard
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The group sync (T25): mirrors each tenant's users, groups and memberships
  # under /t/<tenant_id>/ from Keycloak into the identity tables as
  # nava_groupsync, every NAVA_GROUPSYNC_INTERVAL (at most 5m). A principal
  # resolves (GET /api/v1/me) only once a cycle has synced it; the stack tests
  # run one cycle on demand with `docker compose run --rm --no-deps
  # nava-groupsync --once`. On `internal` only; admin listener :9090.
  nava-groupsync:
    build:
      context: .
      dockerfile: deploy/compose/nava-groupsync/Dockerfile
    image: nava/nava-groupsync:${NAVA_IMAGE_TAG:-dev}
    environment:
      NAVA_DATABASE_URL: postgres://nava_groupsync:${NAVA_GROUPSYNC_DB_PASSWORD:-dev-only-groupsync}@pgbouncer:5432/nava?sslmode=disable
      NAVA_KEYCLOAK_URL: http://keycloak:8080
      NAVA_KEYCLOAK_REALM: nava
      NAVA_GROUPSYNC_CLIENT_ID: nava-groupsync
      NAVA_GROUPSYNC_CLIENT_SECRET: ${NAVA_GROUPSYNC_CLIENT_SECRET:-dev-only-groupsync-secret}
      NAVA_GROUPSYNC_INTERVAL: ${NAVA_GROUPSYNC_INTERVAL:-5m}
      NAVA_LOG_FORMAT: json
      OTEL_SERVICE_NAME: nava-groupsync
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [internal]
    depends_on:
      otel-collector: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  default: {}
  internal:
    internal: true
  # Temporal's own network: the server, the gateway, the schema job and
  # PostgreSQL. No platform process joins it, so the server's other ports have
  # no route from `internal`.
  temporal-backplane:
    internal: true
  # Operator tooling (Temporal UI). Not internal, so the UI can publish a port
  # on 127.0.0.1; the overlay makes it internal.
  operator: {}

volumes:
  pgdata: {}
  # PostgreSQL's Unix socket directory, shared by postgres and db-roles only.
  # tmpfs: no stale socket or lock file survives a restart.
  pgsocket:
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=999,gid=999,mode=0755"}

configs:
  pg_superuser_password:
    content: ${PG_SUPERUSER_PASSWORD:-dev-only-superuser}
  nava_migrator_password:
    content: ${NAVA_MIGRATOR_DB_PASSWORD:-dev-only-migrator}
  pg_hba:
    file: ./db/pg_hba.conf
  pgbouncer_ini:
    file: ./deploy/compose/pgbouncer/pgbouncer.ini
  pgbouncer_userlist:
    content: |
      "pgbouncer_auth" "${PGBOUNCER_AUTH_PASSWORD:-dev-only-pgbouncer}"

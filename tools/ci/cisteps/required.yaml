# The CI steps .github/workflows/ci.yml must keep (TICK-297). make check-ci-steps
# fails when a step below is missing from its job, renamed to another target,
# disabled (`if: false`), allowed to fail (`continue-on-error`) or, for a report,
# no longer uploaded with if-no-files-found: error.
#
# This file is the one list. Add a step here when a suite or report must not be
# dropped silently; removing one is a deliberate edit, reviewed like ci.yml.
#
#   job       the ci.yml job id
#   run       a line of the step's run: block, exactly (a make target)
#   artifact  the name of an actions/upload-artifact step
#   why       what goes unchecked without it
steps:
  # The lint gates that guard the rest.
  - job: lint
    run: make check-generate
    why: regenerates the bundle and api/api.gen.go and fails on any diff or untracked file under api/; without it they drift from api/openapi.yaml unnoticed (TICK-297)
  - job: lint
    run: make check-guide
    why: rebuilds docs/acceptance/guide/ and fails on any diff; without it bruno/lib/nava.js REGISTERED and the pages drift from api/errors.yaml and the spec unnoticed (TICK-391)
  - job: lint
    run: make check-ci-steps
    why: this list stops being enforced (TICK-297)
  - job: lint
    run: make vet-tags
    why: a build-tagged file stops compiling on main and nothing goes red (TICK-320)
  - job: lint
    run: make check-openapi
    why: /api/v1 loses an operation or field without review

  # Story work that never reaches main (TICK-322, after S6 and the S5
  # post-merge PRs, TICK-286).
  - job: story-branches
    run: make check-story-branches
    why: a story branch's changes stay off main once its story PR merged, or forever

  # suiteran: a registered isolation suite that runs zero tests fails the step (TICK-230).
  - job: unit
    run: make test
    why: go test -race under suiteran
  - job: temporal-server
    run: make temporal-server-test
    why: the temporal-server module's tests under suiteran
  - job: temporal-server
    run: make lint-temporal-server
    why: golangci-lint on the temporal-server module; make lint's ./... stops at its go.mod, so without it the D9/E1 authorizer is linted by nothing (TICK-584)

  # The coverage gate (TICK-518): both profiles, the gate and its report.
  - job: unit
    artifact: coverage-unit
    why: the unit coverage profile; without it the coverage job has nothing to merge
  - job: integration
    artifact: coverage-integration
    why: the integration coverage profile; without it DB-backed code drops out of the total
  # Enforcing: no COVERAGE_REPORT_ONLY (TICK-518).
  - job: coverage
    run: make check-coverage
    why: Go coverage below COVERAGE_MIN (95%) merges unnoticed (TICK-518)
  - job: coverage
    artifact: coverage
    why: the merged profile and coverage.html
  - job: full-suite
    run: make check-full-suite
    why: a pull request into a story branch shows a skipped unit, integration or stack job as a passed check and merges with its suites never run (TICK-638)

  # The tenant isolation suite (T11, ADR-001 CI-2).
  - job: integration
    run: make test-integration
    why: integration tests and then the isolation suite, under suiteran; the isolation suite runs on full runs only (the daily run on main, ci:full, a manual run; ISOLATION=0 on a fast run, TICK-652, AR-TICK-652-01)
  - job: integration
    artifact: isolation-report
    why: the CI-2 isolation report, uploaded on full runs (the daily run on main, ci:full, a manual run), with the suite that writes it (TICK-652)

  # The commit-check budget rows (ADR-004-E3, D-E3-4, TICK-509), alone on a runner.
  - job: commit-check-budget
    run: make test-commit-check-budget
    why: the docs/budgets.md commit-check rows (single subject and import, 38 partitions, same-run reference) stop being measured, and the integration shards no longer run TestCommitCheckBudget

  # Stack suites and their reports. The cases are the files in deploy/compose/test/cases/
  # (TICK-296); each job runs the ones whose header names it, so a new case needs no entry here.
  - job: stack
    run: make stack-tests JOB=stack
    why: every stack case with job=stack, among them the CI-6 and CI-7 SDK suite, realm nava and the CI-5 adversarial identity suite (T19), each under suiteran; a fast run keeps the tier=smoke cases only, and full runs (the daily run on main, ci:full, a manual run) run every case (STACK_TIER, TICK-652)
  # stack-db and stack-internal were jobs of their own until TICK-563; their
  # cases now run in the stack job, each on a fresh stack, after its one image
  # build. Same steps, same make targets, moved job.
  - job: stack
    run: make stack-tests JOB=stack-db
    why: the database stack cases (idempotent, dbroles, hba); full runs only (the daily run on main, ci:full, a manual run; TICK-652, AR-TICK-652-01)
  - job: stack
    run: make stack-tests JOB=stack-internal
    why: the internal overlay comes up healthy with no egress; full runs only (the daily run on main, ci:full, a manual run; TICK-652, AR-TICK-652-01)
  - job: stack
    artifact: ci6-report
    why: the CI-6 report (TICK-49), uploaded on full runs (the daily run on main, ci:full, a manual run), where the sdk case that writes it runs (TICK-652)
  - job: stack
    artifact: ci5-report
    why: the CI-5 report, uploaded on full runs (the daily run on main, ci:full, a manual run), where the identity_attacks case that writes it runs (TICK-652)

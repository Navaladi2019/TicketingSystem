# The checked-in copy of .github/workflows/govulncheck.yml (TICK-1149,
# ADR-001-E4 vulncheck contract rule 9). make check-ci-steps fails unless the
# two are equal byte for byte once every comment line (first non-blank
# character #) is dropped from both. Edit both files in the same change; the
# Security & Multi-Tenancy Reviewer reviews any edit (ADR RS3).
name: govulncheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('govulncheck-{0}', github.ref) || format('govulncheck-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vulncheck-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root: ${{ steps.detect.outputs.root }}
      temporal_server: ${{ steps.detect.outputs.temporal_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which modules to scan
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show origin/main:scripts/ci/vulncheck-detect.sh >"$RUNNER_TEMP/vulncheck-detect.sh"
          sh "$RUNNER_TEMP/vulncheck-detect.sh"

  vulncheck-root:
    needs: vulncheck-detect
    if: needs.vulncheck-detect.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install govulncheck
        run: make tools-govulncheck
      - name: govulncheck (root module)
        run: make vulncheck

  vulncheck-temporal-server:
    needs: vulncheck-detect
    if: needs.vulncheck-detect.outputs.temporal_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: temporal-server/go.mod
          cache: false
      - name: Install govulncheck
        run: make tools-govulncheck
      - name: govulncheck (temporal-server)
        run: make vulncheck-temporal-server

  vulncheck:
    needs: [vulncheck-detect, vulncheck-root, vulncheck-temporal-server]
    if: always()
    name: ${{ github.base_ref == 'main' && 'vulncheck' || 'vulncheck-other' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: The pull request's result
        env:
          DETECT_RESULT: ${{ needs.vulncheck-detect.result }}
          ROOT_NEEDED: ${{ needs.vulncheck-detect.outputs.root }}
          TS_NEEDED: ${{ needs.vulncheck-detect.outputs.temporal_server }}
          ROOT_RESULT: ${{ needs.vulncheck-root.result }}
          TS_RESULT: ${{ needs.vulncheck-temporal-server.result }}
        run: sh scripts/ci/vulncheck-gate.sh

  vulncheck-main-red:
    needs: [vulncheck-root, vulncheck-temporal-server]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the P0 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: govulncheck
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: sh scripts/ci/main-red.sh

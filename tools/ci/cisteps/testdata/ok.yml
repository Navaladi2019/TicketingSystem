name: ci
on: pull_request
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.stages.outputs.unit }}
      full: ${{   steps.stages.outputs.full }}
    steps:
      - id: stages
        run: make ci-stages
  unit:
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go
      - name: go test -race
        run: make test
  stack:
    runs-on: ubuntu-latest
    steps:
      - name: CI-5 adversarial identity suite (T19)
        run: |
          make stack-up
          make   identity-attacks
        continue-on-error: false
      - name: CI-5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci5-report
          path: ci5-report.md
          if-no-files-found: error
          retention-days: 5

# Registry of every `code` an API error response may carry (RFC 9457
# problem+json, see api/openapi.yaml). Read through the strict loader
# (internal/platform/strictyaml). A contract test fails on any response whose
# code is not listed here, and on any code listed here that no Go constant
# names. `detail` is fixed text: it never echoes request input.
codes:
  - code: tenant_unresolved
    status: 401
    title: Tenant unresolved
    detail: The request could not be tied to a tenant.
  - code: invalid_token
    status: 401
    title: Invalid token
    detail: The access token is missing, expired or invalid.
  - code: idempotency_key_reuse
    status: 409
    title: Idempotency key reused
    detail: The Idempotency-Key was already used with a different request.
  - code: forbidden
    status: 403
    title: Forbidden
    detail: The token does not allow this operation.
  - code: invalid_idp_config
    status: 422
    title: Invalid identity provider settings
    detail: The identity provider settings are not accepted. See errors for the failing fields.
  - code: domain_claimed
    status: 409
    title: Email domain already claimed
    detail: An email domain of the request is already claimed by a tenant.
  - code: onboarding_conflict
    status: 409
    title: Onboarding conflict
    detail: The organization or identity provider for this tenant already exists and cannot be reused.
  - code: idempotency_in_flight
    status: 409
    title: Request in progress
    detail: A request with this Idempotency-Key is still being processed. Retry after the interval in Retry-After.
  - code: invalid_cursor
    status: 400
    title: Invalid cursor
    detail: The pagination cursor is invalid or has expired.
  - code: rate_limited
    status: 429
    title: Rate limited
    detail: Too many requests. Retry after the interval in Retry-After.
  - code: not_found
    status: 404
    title: Not found
    detail: The resource does not exist.
  - code: validation_failed
    status: 400
    title: Validation failed
    detail: The request does not match the API contract. See errors for the failing fields.
  - code: method_not_allowed
    status: 405
    title: Method not allowed
    detail: The resource does not support this method. See the Allow header.
  - code: not_implemented
    status: 501
    title: Not implemented
    detail: This operation is declared in the contract but not implemented yet.
  - code: internal_error
    status: 500
    title: Internal error
    detail: The server failed to handle the request. Quote the instance when reporting it.
  - code: invalid_definition
    status: 422
    title: Invalid entity definition
    detail: The entity type is not accepted. See errors for the failing fields.
  - code: entity_type_exists
    status: 409
    title: Entity type exists
    detail: An entity type with this key already exists in the tenant.
  - code: number_prefix_taken
    status: 409
    title: Number prefix taken
    detail: Another entity type of the tenant already uses this number prefix.

openapi: 3.1.0
info:
  title: Nava core API
  version: 1.0.0
  description: |
    The public /api/v1 contract. Within v1 changes are additive only: CI diffs
    the bundle against main and fails on a removed or narrowed field.
    Every error response is application/problem+json (RFC 9457) with a `code`
    registered in api/errors.yaml.

    This is the root of the source tree: each path is a $ref to its group file
    in api/paths/. `go generate ./api` bundles the tree into
    openapi.bundled.yaml, which the server embeds and oapi-codegen reads.
paths:
  /api/v1/me:
    $ref: "paths/me.yaml#/paths/~1api~1v1~1me"
  /api/v1/operator/tenants:
    $ref: "paths/operator.yaml#/paths/~1api~1v1~1operator~1tenants"
  /api/v1/entity-types:
    $ref: "paths/entity-types.yaml#/paths/~1api~1v1~1entity-types"
  /api/v1/entity-types/{key}:
    $ref: "paths/entity-types.yaml#/paths/~1api~1v1~1entity-types~1{key}"
  /api/v1/entity-types/{key}/versions:
    $ref: "paths/entity-types.yaml#/paths/~1api~1v1~1entity-types~1{key}~1versions"
  /api/v1/entity-types/{key}/versions/{n}:
    $ref: "paths/entity-types.yaml#/paths/~1api~1v1~1entity-types~1{key}~1versions~1{n}"
  /api/v1/records/{entity}:
    $ref: "paths/records.yaml#/paths/~1api~1v1~1records~1{entity}"
  /api/v1/records/{entity}/{id}:
    $ref: "paths/records.yaml#/paths/~1api~1v1~1records~1{entity}~1{id}"
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. `code` is registered in api/errors.yaml.
      required: [type, title, status, code, detail, instance]
      properties:
        type:
          type: string
          description: A URN naming the problem type, `urn:nava:problem:<code>`.
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
          description: Fixed text per code; never carries request input.
        instance:
          type: string
          description: "`urn:nava:request:<request id>`, the X-Request-Id of the response."
        errors:
          type: array
          description: Present on validation_failed. Never carries request input.
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemNoInstance:
      type: object
      description: >
        A Problem without `instance`, for the 404 of a resource that may belong
        to another tenant: the body is identical for an unknown and a foreign
        resource (D-3-10). The request id is in the X-Request-Id header.
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
    FieldError:
      type: object
      required: [pointer]
      properties:
        pointer:
          type: string
          description: JSON Pointer to the failing field.
        rule:
          type: string
          description: The schema keyword that failed, such as `format` or `pattern`.
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemNoInstance:
      description: An RFC 9457 problem without `instance`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemNoInstance"

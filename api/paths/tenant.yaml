# Path group /api/v1/tenant (TICK-672, P6-07; ADR-005 §3.6).
# Shared schemas (Problem) are in ../openapi.yaml.
paths:
  /api/v1/tenant/settings/time-zone:
    get:
      operationId: getTenantTimeZone
      summary: Read the tenant's numbering time zone (tenant admin)
      description: >
        Tenant admins only. The tenant is the token's; nothing in the request
        names another one. The default is `UTC`.
      responses:
        "200":
          description: The tenant's time zone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTimeZone"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
    put:
      operationId: putTenantTimeZone
      summary: Set the tenant's numbering time zone (tenant admin)
      description: >
        Tenant admins only; the check runs before the body is read any further
        than as well-formed JSON. The body is `{time_zone}`, an IANA name that
        the server knows; anything else (empty, `Local`, an unknown or
        malformed name, a value that is not a string) answers 422
        `invalid_time_zone` with `errors[].pointer` `/time_zone`, and writes
        nothing. Other fields of the body, a `tenant_id` among them, are
        ignored: the tenant is always the token's. A change affects the scope
        keys of future allocations only. A change writes one audit entry
        (`subject_type` `tenant_setting`, domain `config`, `subject_id` the
        tenant id) in the same transaction; actor and source come from the
        token. Setting the value the tenant already has writes nothing and
        answers 200. `Idempotency-Key` is required.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutTenantTimeZoneRequest"
      responses:
        "200":
          description: The time zone now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantTimeZone"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
components:
  schemas:
    PutTenantTimeZoneRequest:
      type: object
      description: >
        Deliberately unconstrained here: the server checks the body after the
        admin check and answers 422 with `errors[].pointer`. Kept as the
        request bytes (`json.RawMessage`).
      x-go-type: json.RawMessage
      properties:
        time_zone:
          description: An IANA time zone name, for example `Europe/Berlin`.
    TenantTimeZone:
      type: object
      required: [time_zone]
      properties:
        time_zone:
          type: string
          description: An IANA time zone name.

# Path group /api/v1/audit (TICK-435, P5-17; ADR-004 R7, R8). Shared schemas (Problem) are in ../openapi.yaml.
paths:
  /api/v1/audit/entries:
    get:
      operationId: listAuditEntries
      summary: The tenant's audit timeline
      description: >
        Needs `audit.read`: a tenant admin or a member of the tenant's
        auditors group, not filtered by record ACL (R8). The tenant's one
        timeline, newest first (`occurred_at`, then `id`), filtered and
        paged. Pages are stable and do not overlap. `page_token` is bound to
        the tenant, the principal, the route and the filters. Each entry's
        `diff` is masked for the reader (R7): a masked value reads
        `{"redacted":"mask"}`, an op that cannot be cut cleanly is
        `{"redacted":"op"}`, and `diff_redacted` says the diff differs from
        the stored one. `diff_salt` comes only with an unredacted diff, so
        `SHA-256(diff_salt || diff)` equals `diff_sha256`. An empty tenant
        returns an empty page. A record entry's diff is masked for the
        reader's record field masks too (P3-33): a property the entity
        type's published ACL hides from the reader reads
        `{"redacted":"mask"}`, as a secret does.
      parameters:
        - name: from
          in: query
          required: false
          description: Entries at or after this time (`occurred_at`).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Entries before this time (`occurred_at`).
          schema:
            type: string
            format: date-time
        - name: domain
          in: query
          required: false
          schema:
            type: string
            enum: [record, config, audit]
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
            enum: [record, cascade_key, entity_definition, acl_policy, audit_export, audit_chain, erasure_request]
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: after_seq
          in: query
          required: false
          description: Only sealed entries whose chain `seq` is above this.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: page_token
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: One page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryList"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/audit/entries:export:
    get:
      operationId: exportAuditEntries
      summary: Download a verifiable JSONL export of the audit log
      description: >
        Needs `audit.export`: a tenant admin or a member of the tenant's
        auditors group (R8). Streams `nava.audit.export/v1` JSONL (header,
        anchor, the sealed range, unsealed matches, trailer;
        `docs/api/audit-export-v1.md`) that `nava audit verify` accepts under
        any filter. The `audit/export` entry commits before the first byte, and
        one export runs per tenant at a time (R19): a second gets 409
        `export_in_progress`. The range starts at the entry before the first
        sealed entry of the time window and runs to the chain head read at the
        start (R20). Entries that match are in full, the others are hash-only
        stubs, unless `stubs=false`, which sends matches only and verifies
        `unverifiable` when the filter leaves a gap. Diffs are masked for the
        caller and `diff_salt` comes only with an unredacted diff (R7). Pages
        of 5,000 rows, each its own short transaction, stop after 15 minutes
        (R21). An error after the first byte ends the file without a trailer.
      parameters:
        - name: from
          in: query
          required: false
          description: Entries at or after this time (`occurred_at`).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Entries before this time (`occurred_at`).
          schema:
            type: string
            format: date-time
        - name: domain
          in: query
          required: false
          schema:
            type: string
            enum: [record, config, audit]
        - name: subject_type
          in: query
          required: false
          schema:
            type: string
            enum: [record, cascade_key, entity_definition, audit_export, audit_chain, erasure_request]
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: change_set_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: after_seq
          in: query
          required: false
          description: Incremental export. The range starts at `after_seq + 1`, anchored on `after_seq`.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: stubs
          in: query
          required: false
          description: Send non-matching entries of the range as stubs (default) or leave them out.
          schema:
            type: boolean
            default: true
        - name: format
          in: query
          required: false
          description: >
            `jsonl` (default) or `csv`: the same lines as RFC 4180 CSV
            (`docs/api/audit-export-v1.md` section 5). Any other value is 400
            `validation_failed`.
          schema:
            type: string
            enum: [jsonl, csv]
            default: jsonl
      responses:
        "200":
          description: The export, one JSON object per line, or CSV when `format=csv`.
          content:
            application/x-ndjson:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/audit/chain:reseed:
    post:
      operationId: reseedAuditChain
      summary: Restart a dead audit seal lineage
      description: >
        Needs `audit.export`: a tenant admin or a member of the tenant's
        auditors group (R17, ADR-001-A6.3). While the tenant's seal lineage is
        alive, that is until its next run is more than 10 minutes overdue, the
        call is refused with 409 `chain_alive` and writes nothing. Otherwise it
        starts a new lineage at the head's current version, retires the old
        one and writes an `audit/reseed` entry. The tenant is the token's.
        There is no request body. `Idempotency-Key` is required: a retry with
        the same key returns the first answer.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: The new lineage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainReseed"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
components:
  schemas:
    ChainReseed:
      type: object
      required: [reseed_id, seal_outbox_id]
      properties:
        reseed_id:
          type: string
          format: uuid
          description: The id of the `audit/reseed` entry.
        seal_outbox_id:
          type: string
          format: uuid
          description: The new lineage's start row.
    AuditEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_page_token:
          type: string
    AuditEntry:
      type: object
      required: [id, occurred_at, domain, action, subject_type, subject_id, source, causation_depth, backfilled, diff_truncated, diff_redacted]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        domain:
          type: string
          enum: [record, config, audit]
        action:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
          format: uuid
        entity_definition_id:
          type: string
          format: uuid
        version_before:
          type: integer
          format: int64
        version_after:
          type: integer
          format: int64
        actor_principal_id:
          type: string
          format: uuid
          description: Absent when a system actor made the change (`actor_system`).
        actor_system:
          type: string
        source:
          type: string
        source_ref:
          type: string
        change_set_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
        causation_depth:
          type: integer
        request_id:
          type: string
        backfilled:
          type: boolean
        content_sha256:
          type: string
          description: Lowercase hex.
        diff_sha256:
          type: string
          description: Lowercase hex.
        diff_truncated:
          type: boolean
        diff:
          description: The RFC 6902 patch as this reader may see it. Absent when the entry has none or it was erased.
          x-go-type: json.RawMessage
        diff_redacted:
          type: boolean
          description: True when `diff` differs from the stored diff for this reader (R7).
        diff_salt:
          type: string
          description: Lowercase hex. Present only with an unredacted diff.
        seq:
          type: integer
          format: int64
          description: The chain position. Absent until the entry is sealed.
        sealed_at:
          type: string
          format: date-time
        erased_at:
          type: string
          format: date-time

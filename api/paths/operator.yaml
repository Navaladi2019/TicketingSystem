# Path group /api/v1/operator. Schemas only this group uses live here; shared
# ones (Problem) are in ../openapi.yaml and referenced as ../openapi.yaml#/...
paths:
  /api/v1/operator/tenants:
    post:
      operationId: onboardTenant
      summary: Onboard a tenant (operator token only)
      description: >
        Creates the tenant, its Keycloak organization and IdP, the identity
        binding and email domains, invites the first admin, and marks the
        tenant active (T21). Requires an operator token (realm role
        nava-operator, audience nava-operator-api); a tenant token is refused.
        The tenant id is derived on the server from the operator and the
        Idempotency-Key; any tenant id in the body, query or a header is
        ignored. A retry with the same key and body resumes; the same key with
        a different body is 409 idempotency_key_reuse.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardTenantRequest"
      responses:
        "201":
          description: The tenant was onboarded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardedTenant"
        "200":
          description: The same request was already completed; nothing new was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardedTenant"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/operator/tenants/{tenant}/limits:
    put:
      operationId: setTenantLimits
      summary: Set a tenant's limits (operator token only)
      description: >
        Sets the tenant's per-type filterable-field limit, from the default 5
        up to 10 (ADR-006 D12), with no per-tenant DDL (I8). Requires an
        operator token (realm role nava-operator, audience
        nava-operator-api); a tenant token is refused with 403. The change is
        one audited tenant_limits row (subject tenant_limits, the operator as
        actor, the reason in the entry); setting the value already in force
        writes nothing, so a retry is one audit entry. Publish enforces the
        limit from the next publish on. An unknown tenant is 404.
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTenantLimitsRequest"
      responses:
        "200":
          description: The limits now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantLimits"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
components:
  schemas:
    SetTenantLimitsRequest:
      type: object
      required: [filterable_fields_per_type, reason]
      properties:
        filterable_fields_per_type:
          type: integer
          minimum: 5
          maximum: 10
          description: The most filterable fields one entity type of the tenant may flag.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the limit changes (for example, the measured cost check). Recorded in the audit entry.
    TenantLimits:
      type: object
      required: [filterable_fields_per_type]
      properties:
        filterable_fields_per_type:
          type: integer
          minimum: 5
          maximum: 10
    OnboardTenantRequest:
      type: object
      required: [admin_email, email_domains, identity_provider]
      properties:
        admin_email:
          type: string
          maxLength: 254
          description: The first tenant admin. Its domain must be one of email_domains.
        email_domains:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            Email domains the operator attests the tenant owns. Public
            email-provider domains are refused.
          items:
            type: string
            maxLength: 253
        identity_provider:
          $ref: "#/components/schemas/OnboardIdP"
    OnboardIdP:
      type: object
      required: [provider_id, config]
      properties:
        provider_id:
          type: string
          enum: [oidc, saml]
        display_name:
          type: string
          maxLength: 128
        config:
          type: object
          description: >
            Provider settings (endpoints, client id and secret). URLs must be
            https and resolve to public hosts. validateSignature and syncMode
            are set by the platform whatever is sent.
          additionalProperties:
            type: string
            maxLength: 8192
    OnboardedTenant:
      type: object
      required: [tenant_id, state]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Derived on the server from the operator and the Idempotency-Key.
        state:
          type: string
          enum: [active]

# Path group /api/v1/records (TICK-357, P3-14). Shared schemas (Problem) are in ../openapi.yaml.
paths:
  /api/v1/records/{entity}:
    post:
      operationId: createRecord
      summary: Create a record of an entity type
      description: >
        Check order: authentication, then the entity type (an unknown key is a
        404), then the authorizer, then the body. The body is `{data}`; `data`
        is validated against the current schema version, defaults applied, and
        the write goes through the record write pipeline with source `user`
        and the caller as actor. `Idempotency-Key` is required: a retry with
        the same key returns the stored response and creates nothing.
        A field that fails the schema, or a reference to a principal that does
        not exist in the tenant, answers 422 `record_invalid` with
        `errors[].pointer` under `/data`; the same body for a random UUID and
        for another tenant's principal. An assignment group that is not a
        live group of the tenant (removed, another tenant's group, live or
        removed, or a random UUID) answers 422 `assignment_group_removed`
        with the pointer of the group property, one body for every case,
        and writes nothing. An unknown entity type gives the 404 of
        getRecord, byte for byte, with no `instance`.
      parameters:
        - $ref: "#/components/parameters/Entity"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecordRequest"
      responses:
        "201":
          description: The record exists at version 1.
          headers:
            ETag:
              required: true
              description: Weak ETag of the version, `W/"<version>"`.
              schema:
                type: string
            Location:
              required: true
              description: Path of the new record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/records/{entity}/{id}:
    get:
      operationId: getRecord
      summary: Read a record
      description: >
        Any user of the tenant (S9). `data` has the defaults of the current
        schema version applied for properties an older version never wrote.
        `assignment_group` shows the record's group with `removed: true` once
        it has been removed from the directory.
        A missing record, another tenant's record, a record of another entity
        type, an id that is not a UUID and an unknown entity type key give the
        same 404, byte for byte, with no `instance`.
      parameters:
        - $ref: "#/components/parameters/Entity"
        - name: id
          in: path
          required: true
          description: The record id. Its shape is not checked here, an id that cannot exist is a 404.
          schema:
            type: string
      responses:
        "200":
          description: The record.
          headers:
            ETag:
              required: true
              description: Weak ETag of the version, `W/"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
    patch:
      operationId: patchRecord
      summary: Update a record with a JSON Merge Patch
      description: >
        Body `application/merge-patch+json`: `{data, state}`, both optional but
        at least one. `data` is a JSON Merge Patch (RFC 7396) applied inside the
        record write pipeline: `null` removes a key (a required property with a
        default is refilled, one without is a 422 at its path), objects merge,
        arrays and scalars replace. `state` is the state property's new value
        and wins over the same property inside `data`. The caller's `ETag` is
        required in `If-Match`; `*` counts as missing.
        Check order: authentication, entity type and record (the one 404),
        `If-Match` missing (428), stale (412), then the authorizer and the body
        (422). A missing record never answers 428. A 412 carries the current
        `ETag` in the header and in `detail`, and no record data.
        `Idempotency-Key` is required: a retry with the same key returns the
        stored response, `ETag` included.
        A patch that changes the assignment group to one that is not a live
        group of the tenant answers the 422 `assignment_group_removed` of
        createRecord, the same body, and changes nothing. A patch that leaves
        a removed group unchanged succeeds.
      parameters:
        - $ref: "#/components/parameters/Entity"
        - name: id
          in: path
          required: true
          description: The record id. Its shape is not checked here, an id that cannot exist is a 404.
          schema:
            type: string
        - name: If-Match
          in: header
          required: false
          description: >
            The `ETag` the update is based on. Optional in the contract only so
            that its absence is the registered 428 and not a generic 400.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PatchRecordRequest"
      responses:
        "200":
          description: The record after the update.
          headers:
            ETag:
              required: true
              description: Weak ETag of the new version, `W/"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "412":
          description: The record is not at the version of `If-Match`.
          headers:
            ETag:
              required: true
              description: Weak ETag of the current version.
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "428":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/records/{entity}/{id}/history:
    get:
      operationId: getRecordHistory
      summary: A record's change history
      description: >
        Any user of the tenant (S9). The record's `create` and `update` audit
        rows, newest first, cursor-paged. The cursor is bound to the tenant,
        the principal and the route. `before` and `after` are the record's
        `data` before and after the write (merge-patch semantics: an absent key
        is a removed key; `before` is absent on a create). `changed` lists the
        JSON pointers, under `/data`, of the properties that differ; arrays
        count as one value. Values are unmasked until S10. The 404 is that of
        getRecord, byte for byte, with no `instance`.
        A record with more than 500 audit entries is a 422 `history_too_long`:
        one page replays the whole history, so the history is capped
        (docs/budgets.md).
      parameters:
        - $ref: "#/components/parameters/Entity"
        - name: id
          in: path
          required: true
          description: The record id. Its shape is not checked here, an id that cannot exist is a 404.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: One page of history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordHistory"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
components:
  parameters:
    Entity:
      name: entity
      in: path
      required: true
      description: The entity type key. Its shape is not checked here, a key that cannot exist is a 404.
      schema:
        type: string
  schemas:
    CreateRecordRequest:
      type: object
      description: >
        Deliberately unconstrained here: the server resolves the entity type
        first (404), then reads `{data}` and answers 422 `record_invalid`.
      x-go-type: json.RawMessage
      properties:
        data:
          description: The record payload, an object.
    Record:
      type: object
      required: [id, number, version, schema_version, state, data, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        version:
          type: integer
          format: int64
        schema_version:
          type: integer
        state:
          type: string
        data:
          type: object
          additionalProperties: true
        assignment_group:
          $ref: "#/components/schemas/RecordAssignmentGroup"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RecordAssignmentGroup:
      type: object
      description: >
        The record's assignment group, the value of the property mapped to the
        `assignment_group_id` fixed column. Absent when the record has none.
        `removed` is true once the group has been removed from the directory:
        the record keeps pointing at it and nothing reassigns it
        (ADR-004-E5 D7).
      required: [id, removed]
      properties:
        id:
          type: string
          format: uuid
        removed:
          type: boolean
    PatchRecordRequest:
      type: object
      description: >
        Deliberately unconstrained here: the server resolves the record and
        `If-Match` first (404, 428, 412), then reads `{data, state}` and
        answers 422 `record_invalid`.
      x-go-type: json.RawMessage
      properties:
        data:
          description: A JSON Merge Patch (RFC 7396) on the record payload, an object.
        state:
          description: The new value of the state property, a string.
    RecordHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordChange"
        next_cursor:
          type: string
    RecordChange:
      type: object
      required: [at, source, action, changed, after]
      properties:
        at:
          type: string
          format: date-time
        actor_id:
          type: string
          format: uuid
          description: Absent when a system writer made the change.
        source:
          type: string
        action:
          type: string
          enum: [create, update]
        changed:
          type: array
          items:
            type: string
        before:
          type: object
          additionalProperties: true
          description: Absent on a create.
        after:
          type: object
          additionalProperties: true

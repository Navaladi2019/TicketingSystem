# Path group /api/v1/entity-types (TICK-343, P3-05a; publish is TICK-365, P3-05b). Shared schemas (Problem) are in ../openapi.yaml.
paths:
  /api/v1/entity-types:
    get:
      operationId: listEntityTypes
      summary: List the tenant's entity types
      description: >
        Any user of the tenant. Ordered by key, cursor-paged. `limit` defaults
        to 50 and is at most 200.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: One page of entity types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeList"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
    post:
      operationId: createEntityType
      summary: Create an entity type (tenant admin)
      description: >
        Creates the entity type and its version 1. Tenant admins only; the
        check runs before the body is read any further than as well-formed
        JSON, so every field rule below answers 422 `invalid_definition` to an
        admin and nothing to anyone else. The body is
        `{key, name, number_prefix, definition: {schema, fixed_columns,
        states}}`: `key` matches `^[a-z][a-z0-9_]{1,40}$`, `name` is 1 to 120
        characters, `number_prefix` matches `^[A-Z]{2,6}$` and never changes
        after create, and `definition` is the entity definition without key
        and number prefix. `schema` is stored as the exact request bytes.
        A definition that requires a property marked `x-nava-secret` or
        `writeOnly` (in `required` or `dependentRequired`, at the root or in any
        subschema that applies there) answers 422 `definition_secret_required`,
        with `errors[].pointer` naming the offending entry; the marker itself
        is legal.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityTypeRequest"
      responses:
        "201":
          description: The entity type exists, at version 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeVersion"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/entity-types/{key}:
    get:
      operationId: getEntityType
      summary: The current version of an entity type
      description: >
        Any user of the tenant. An unknown key and another tenant's key give
        the same 404, byte for byte, with no `instance`.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: The current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeVersion"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/entity-types/{key}/versions:
    post:
      operationId: publishEntityTypeVersion
      summary: Publish the next version of an entity type (tenant admin)
      description: >
        Publishes immutable version N+1 and makes it the current version.
        Tenant admins only; the check runs before the body is read any
        further than as well-formed JSON. The body is `{definition: {schema,
        fixed_columns, states}}`; a `number_prefix` field answers 422
        `invalid_definition`, because the prefix never changes after create.
        The new definition is classified against the current version (D-3-5):
        a breaking change answers 422 `schema_breaking_change` with
        `errors[].pointer` naming each offending path, and adds nothing.
        A definition that requires a marked (`x-nava-secret` or `writeOnly`)
        property answers 422 `definition_secret_required`, with
        `errors[].pointer` naming the offending `required` entry, and adds
        nothing.
        Compatible and needs-backfill changes publish. An unknown key and
        another tenant's key give the same 404, byte for byte, with no
        `numbering_mode` (`gaps` or `gapless`, D-3-9) may be sent with or instead
        of `definition`; alone it changes the mode, publishes no version and
        answers the current version. Any other value answers 422
        `invalid_definition` at `/numbering_mode`. Numbering carries on from the
        type's counter.
        `instance`. `Idempotency-Key` is required.
      parameters:
        - $ref: "#/components/parameters/Key"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishEntityTypeVersionRequest"
      responses:
        "201":
          description: The new version, now current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeVersion"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/entity-types/{key}/versions/{n}:
    get:
      operationId: getEntityTypeVersion
      summary: One published version of an entity type
      description: >
        Any user of the tenant. `schema` is the stored bytes, exactly as
        published, and `schema_sha256` is the SHA-256 of those bytes in
        lowercase hex. A version that does not exist, including 0 and a
        negative number, gives the same 404 as an unknown key.
      parameters:
        - $ref: "#/components/parameters/Key"
        - name: n
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTypeVersion"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
  /api/v1/entity-types/{key}/access:
    get:
      operationId: getEntityTypeAccess
      summary: The entity type's published access policy (tenant admin)
      description: >
        Tenant admins only, own tenant only. Returns the newest published ACL
        version: `{version, rules, masks, published_by, published_at}` with
        `ETag: W/"<version>"`. `published_by` is null for a version no
        principal published (the onboarding default). 404 when the key is
        unknown, is another tenant's, or has no published version; the body is
        the same in each case.
      parameters:
        - $ref: "#/components/parameters/Key"
      responses:
        "200":
          description: The newest access policy version.
          headers:
            ETag:
              required: true
              description: Weak ETag of the version, `W/"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
    put:
      operationId: putEntityTypeAccess
      summary: Publish the next access policy version (tenant admin)
      description: >
        Publishes immutable ACL version N+1 from the body `{rules, masks}`
        (`masks` optional). Tenant admins only, own tenant only. `If-Match`
        carries the `ETag` the publish is based on; the first publish uses
        `W/"0"`. A body that is not a JSON object is 400 `validation_failed`
        (the validator); 422 is for an object that breaks the policy rules. Check order: authentication, admin (403), entity type (404),
        `If-Match` missing (428 `if_match_required`), stale (412
        `version_conflict`, current `ETag` in the header), then the body (422
        `invalid_access_policy` with `errors[].pointer` and `rule`). The body
        is refused when a column, op or `caller` is unknown, a shape rule of
        the database is broken, a rule id repeats, a mask field is not a
        top-level schema property, a mask subject sets `requester`, `assignee`
        or `shared`, a mask's `write` names a group or user its `read` does not,
        or any group or user id (in a subject or a condition) is not in the
        tenant (`not_in_tenant`, the same for an unknown id and another
        tenant's). A refused request writes no version and no audit entry. The
        publish writes one audit entry in the same transaction.
        `Idempotency-Key` is required.
      parameters:
        - $ref: "#/components/parameters/Key"
        - name: If-Match
          in: header
          required: false
          description: >
            The `ETag` of the version the publish is based on. Optional in the
            contract only so that its absence is the registered 428.
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAccessPolicyRequest"
      responses:
        "200":
          description: The published version.
          headers:
            ETag:
              required: true
              description: Weak ETag of the new version, `W/"<version>"`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPolicy"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "403":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/ProblemNoInstance"
        "412":
          description: The `If-Match` version is not the newest; the current `ETag` is in the header.
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        "422":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "428":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "429":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "500":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "501":
          $ref: "../openapi.yaml#/components/responses/Problem"
components:
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: >
        The entity type key. Its shape is not checked here, a key that cannot exist is a 404.
      schema:
        type: string
  schemas:
    PutAccessPolicyRequest:
      type: object
      description: >
        Deliberately unconstrained here: the server checks every field after
        the admin check and answers 422 `invalid_access_policy` with
        `errors[].pointer`. Kept as the request bytes (`json.RawMessage`).
      x-go-type: json.RawMessage
      properties:
        rules:
          description: "Array of `{id, ops, who, where?}`; may be empty (nobody is allowed)."
        masks:
          description: "Array of `{field, read, write}`; optional."
    AccessPolicy:
      type: object
      required: [version, rules, masks, published_at]
      properties:
        version:
          type: integer
        rules:
          type: array
          items:
            type: object
        masks:
          type: array
          items:
            type: object
        published_by:
          type: [string, "null"]
          format: uuid
        published_at:
          type: string
          format: date-time
    CreateEntityTypeRequest:
      type: object
      description: >
        Deliberately unconstrained here: the server checks every field after
        the admin check and answers 422 `invalid_definition` with
        `errors[].pointer`. Kept as the request bytes (`json.RawMessage`) so
        the schema is stored byte for byte.
      x-go-type: json.RawMessage
      properties:
        key:
          description: "`^[a-z][a-z0-9_]{1,40}$`"
        name:
          description: 1 to 120 characters.
        number_prefix:
          description: "`^[A-Z]{2,6}$`, unique per tenant, never changes."
        numbering_mode:
          description: "`gaps` (default) or `gapless`, optional."
        definition:
          description: "`{schema, fixed_columns, states}`, see the metadata engine."
    PublishEntityTypeVersionRequest:
      type: object
      description: >
        Deliberately unconstrained here, like CreateEntityTypeRequest: the
        server checks every field after the admin check. Kept as the request
        bytes so the schema is stored byte for byte.
      x-go-type: json.RawMessage
      properties:
        numbering_mode:
          description: "`gaps` or `gapless`. Alone, it changes the mode and publishes no version."
        definition:
          description: "`{schema, fixed_columns, states}`, see the metadata engine."
    EntityTypeVersion:
      type: object
      required: [key, name, number_prefix, numbering_mode, version, current, schema, schema_sha256, fixed_columns, states, compat, published_at]
      properties:
        key:
          type: string
        name:
          type: string
        number_prefix:
          type: string
        numbering_mode:
          type: string
          enum: [gaps, gapless]
          description: How the type numbers its records (D-3-9). Belongs to the type, not the version.
        version:
          type: integer
        current:
          type: boolean
          description: Whether this is the version new records are written under.
        schema:
          description: The JSON Schema 2020-12 document, as the stored bytes.
        schema_sha256:
          type: string
          description: Lowercase hex SHA-256 of the stored schema bytes.
        fixed_columns:
          type: object
          additionalProperties:
            type: string
        states:
          type: object
        compat:
          type: string
          enum: [initial, compatible, needs_backfill]
        published_at:
          type: string
          format: date-time
    EntityTypeSummary:
      type: object
      required: [key, name, number_prefix, numbering_mode, current_version, updated_at]
      properties:
        key:
          type: string
        name:
          type: string
        number_prefix:
          type: string
        numbering_mode:
          type: string
          enum: [gaps, gapless]
        current_version:
          type: integer
        updated_at:
          type: string
          format: date-time
    EntityTypeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityTypeSummary"
        next_cursor:
          type: string
          description: Present when more entity types follow; pass it as `cursor`.

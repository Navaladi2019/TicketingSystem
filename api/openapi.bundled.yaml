        number:
          type: string
        version:
          type: integer
          format: int64
        schema_version:
          type: integer
        state:
          type: string
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProblemNoInstance:
      description: An RFC 9457 problem without `instance`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemNoInstance"
  parameters:
    Key:
      name: key
      in: path
      required: true
      description: >
        The entity type key. Its shape is not checked here, a key that cannot exist is a 404.


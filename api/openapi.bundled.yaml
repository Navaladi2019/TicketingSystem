        key:
          type: string
        name:
          type: string
        number_prefix:
          type: string
        version:
          type: integer
        current:
          type: boolean
          description: Whether this is the version new records are written under.
        schema:
          description: The JSON Schema 2020-12 document, as the stored bytes.
        schema_sha256:
          type: string
          description: Lowercase hex SHA-256 of the stored schema bytes.
        fixed_columns:
          type: object
          additionalProperties:
            type: string
        states:
          type: object
        compat:
          type: string
          enum: [initial, compatible, needs_backfill]
        published_at:
          type: string
          format: date-time
    EntityTypeSummary:
      type: object
      required: [key, name, number_prefix, current_version, updated_at]
      properties:
        key:
          type: string
        name:
          type: string
        number_prefix:
          type: string
        current_version:
          type: integer
        updated_at:
          type: string
          format: date-time

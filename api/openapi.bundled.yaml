        name:
          description: 1 to 120 characters.
        number_prefix:
          description: "`^[A-Z]{2,6}$`, unique per tenant, never changes."
        definition:
          description: "`{schema, fixed_columns, states}`, see the metadata engine."
    PublishEntityTypeVersionRequest:
      type: object
      description: >
        Deliberately unconstrained here, like CreateEntityTypeRequest: the server checks every field after the admin check. Kept as the request bytes so the schema is stored byte for byte.

      x-go-type: json.RawMessage
      properties:
        definition:

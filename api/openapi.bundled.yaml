        errors:
          type: array
          description: Present on validation_failed. Never carries request input.
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemNoInstance:
      type: object
      description: >
        A Problem without `instance`, for the 404 of a resource that may belong to another tenant: the body is identical for an unknown and a foreign resource (D-3-10). The request id is in the X-Request-Id header.

      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
    FieldError:
      type: object
      required: [pointer]
      properties:
        pointer:
          type: string

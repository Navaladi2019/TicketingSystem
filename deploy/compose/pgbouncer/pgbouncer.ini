; Mounted by compose.yaml. userlist.txt (the auth_user's credentials) is a
; compose config built from PGBOUNCER_AUTH_PASSWORD.
[databases]
nava = host=postgres port=5432 dbname=nava
; TICK-657: nava-core's record-number allocator pool (NAVA_ALLOCATOR_DATABASE_URL)
; connects to the same database through this entry, so it has a server pool of
; its own, as wide as the allocator pool (cmd/nava-core/allocator.go). A create
; takes its number while its own transaction holds a server connection of the
; nava entry; sharing that server pool, 20 open creates would wait forever.
; ADR-005 A5: pool_size = 4 x nava-core replicas (one replica here). Raise it
; with the replica count, and max_connections with it (docs/budgets.md
; "Connection sizing", AR-TICK-653-04). Never give nava_app a [users]
; pool_size: PgBouncer takes the user's size first, which would override this.
nava_alloc = host=postgres port=5432 dbname=nava pool_size=4

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Every other role is looked up with this function (created by db-init), so
; adding a role needs no PgBouncer change.
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
; ADR-001: transaction mode, and prepared statements need max_prepared_statements > 0.
pool_mode = transaction
max_prepared_statements = 100
default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits
; Read-only console access for the stack tests (SHOW CONFIG, SHOW VERSION).
stats_users = pgbouncer_auth

; ADR-004-A1 A1-8: the audit reader (nava_audit_reader) gets at most five
; server connections, as its pool's MaxConns; a sixth client queues rather
; than failing its login (no CONNECTION LIMIT on the role).
[users]
nava_audit_reader = pool_size=5
; TICK-663: the other service roles' server pools are capped at their
; clients' MaxConns (cmd/nava-purge, cmd/nava-onboard, cmd/nava-groupsync),
; which they never exceed, so the connection budget in docs/budgets.md counts
; what can really open. nava_worker is capped at its main pool (10, the
; record pipeline's own pool 4, the readiness probe 1; cmd/nava-worker,
; TestWorkerPoolsFitPgBouncer). nava_relay uses pgxpool's default width
; (max(4, CPUs)) and keeps default_pool_size. pgbouncer_auth only runs
; the auth_query, one short lookup per login: one server connection per entry.
nava_worker = pool_size=15
nava_purge = pool_size=3
nava_onboard = pool_size=8
nava_groupsync = pool_size=2
pgbouncer_auth = pool_size=1

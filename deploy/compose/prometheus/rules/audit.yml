# Audit sealer alerts (ADR-004 R-A2, TICK-453). Local dev only, like the
# scrape config; prometheus.yml loads every file in this directory.
#
# audit_unsealed_oldest_seconds is, per nava-worker, the age of the oldest
# unsealed audit entry over the tenants that worker sealed (no tenant label;
# the tenant is on the worker's "audit seal failed" log line). Sealing lag is
# about 10 s for an active tenant and up to 300 s after idle, so 600 s means a
# tenant is stuck: a poison entry (audit_seal_failures_total{reason="unsealable"}
# rises with it) or a sealer outage. Recovery: fix the entry, or
# POST /api/v1/audit/chain:reseed for a dead lineage (R17).
#
# audit_dead_lineages (TICK-590) is nava-purge's count, over every tenant, of
# the audit_chain_head rows that match R17's chain:reseed predicate
# (next_seal_at < now() - 10 min, internal/audit/lineage.Predicate): a lineage
# that stopped, whatever stopped it. No tenant label; nava-purge logs
# "audit seal lineage dead" with the tenant_id. It fires exactly when a reseed
# becomes allowed. nava-purge withdraws the gauge when its read fails, so
# AuditDeadLineageCheckDown pages when the series has been gone for 5 min
# (TICK-591): a check that keeps failing must not look like "no dead
# lineages". Tests: ../tests/audit_test.yml (lineage.TestAlertRules).
groups:
  - name: audit
    rules:
      - alert: AuditSealLag
        expr: max(audit_unsealed_oldest_seconds) > 600
        labels:
          severity: warning
        annotations:
          summary: An audit entry has been unsealed for more than 600 s (ADR-004 R-A2).
          description: >-
            Check audit_seal_failures_total and the nava-worker "audit seal failed"
            log line for the tenant; a poison entry blocks the tenant until fixed,
            and a dead lineage needs chain:reseed.
      - alert: AuditDeadLineage
        expr: max(audit_dead_lineages) > 0
        labels:
          severity: critical
        annotations:
          summary: An audit seal lineage has stopped; its next run is more than 10 min overdue (ADR-004 R17).
          description: >-
            No run will seal the tenant's entries again until
            POST /api/v1/audit/chain:reseed. The tenant_id is on the
            nava-purge "audit seal lineage dead" log line.
      - alert: AuditDeadLineageCheckDown
        expr: absent(audit_dead_lineages)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The audit dead-lineage check has reported nothing for 5 min, so a stopped seal lineage would not alert (ADR-004 R17).
          description: >-
            nava-purge withdraws audit_dead_lineages when its read fails. Check
            the nava-purge "audit dead lineage check failed" log line (a lost
            grant, a dropped policy or a renamed column), and that nava-purge
            is up and scraped.

# Access-policy alerts (ADR-010 R7, TICK-944). Local dev only, like the
# scrape config; prometheus.yml loads every file in this directory.
#
# authz_policy_invalid_total{entity_type} counts the policies the planner
# voided (D5b), once per evaluation, in nava-core (internal/authz/metrics.go).
# A voided policy grants nothing, so the users it should admit silently lose
# access. It should stay at zero: the access route and the acl_versions CHECK
# refuse invalid nodes before they are stored, so any increase means the
# planner and the save-time checks disagree. No tenant label (TICK-93): the
# nava-core log line "authz: access policy voided, it grants nothing" names
# the entity type and the ACL version. Tests: ../tests/authz_test.yml
# (lineage.TestAlertRules).
groups:
  - name: authz
    rules:
      - alert: AuthzPolicyInvalid
        expr: sum by (entity_type) (increase(authz_policy_invalid_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: An access policy was voided as invalid on {{ $labels.entity_type }} and grants nothing (ADR-010 R7).
          description: >-
            Users the policy should admit have lost access. Publish and the
            database CHECK should have refused the document, so this is a
            drift between them: read the policy and its pointer in the
            explainer's invalid list, republish a valid document, and file a
            bug on the check that let it through.
      # authz_under_set_too_large_total{entity_type} (ADR-010 D7, TICK-950):
      # an under leaf's org-unit set S held more than 10,000 units, so the
      # request got 500 access_scope_too_large. Every count is a refused
      # request; groupsync_org_subtree_max shows an outgrown tree first.
      - alert: AuthzUnderSetTooLarge
        expr: sum by (entity_type) (increase(authz_under_set_too_large_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Access checks on {{ $labels.entity_type }} are refused because an under rule's org-unit set exceeds 10,000 units (ADR-010 D7).
          description: >-
            Users matched by this entity type's under rule get 500
            access_scope_too_large on every read and write it decides. Narrow
            the rule to smaller org units, or reduce the org tree, then
            republish; the nava-core log line "authz: under set too large"
            names the entity type and ACL version.

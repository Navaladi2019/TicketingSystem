# promtool test rules for rules/groupsync.yml (TICK-1072). Run by
# internal/audit/lineage.TestAlertRules (integration) with the pinned
# prom/prometheus image; this directory is not mounted into Prometheus.
rule_files:
  - ../rules/groupsync.yml

evaluation_interval: 1m

tests:
  # At the certified 10,111 the alert never fires, however long it stays.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_units_live_max{job="nava",instance="nava-groupsync:9090"}'
        values: '10111+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: GroupsyncOrgUnitsAboveCertified
        exp_alerts: []
  # 10,112 is pending for 10 m, then fires.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_units_live_max{job="nava",instance="nava-groupsync:9090"}'
        values: '10112+0x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: GroupsyncOrgUnitsAboveCertified
        exp_alerts: []
      - eval_time: 11m
        alertname: GroupsyncOrgUnitsAboveCertified
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nava
              instance: nava-groupsync:9090
            exp_annotations:
              summary: A tenant has more live org units than ADR-010-A2 is certified to (10,111).
              description: >-
                Find the tenant in the nava-groupsync log line "largest live
                org-unit tree" (tenant_id, live_org_units). ADR-010-A2 A2-R6:
                lists for region-only callers may exceed 150 ms above the
                certified tree; re-decide A2-R6 with the Solution
                Architect. Never refuse the sync.
  # Unrooted units: fires on an increase, silent when flat above 0 or absent.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_unrooted_units_total{job="nava",instance="nava-groupsync:9090"}'
        values: '0 0 0 1+0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: GroupsyncOrgUnitsUnrooted
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nava
              instance: nava-groupsync:9090
            exp_annotations:
              summary: Live org units are outside every region (no closure self row).
              description: >-
                Find the tenant in the nava-groupsync log line "live org units have
                no closure self row and are outside every region". Never refuse the
                sync.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_unrooted_units_total{job="nava",instance="nava-groupsync:9090"}'
        values: '3+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GroupsyncOrgUnitsUnrooted
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'groupsync_org_units_live_max{job="nava",instance="nava-groupsync:9090"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GroupsyncOrgUnitsUnrooted
        exp_alerts: []
  # Closure drift repairs: fires on an increase, silent when flat or absent.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_drift_repairs_total{job="nava",instance="nava-groupsync:9090"}'
        values: '0 0 0 1+0x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nava
              instance: nava-groupsync:9090
            exp_annotations:
              summary: Group sync found the stored org closure different from the live org tree and repaired it.
              description: >-
                Find the tenant in the nava-groupsync log line "the stored org
                closure differed from the live org tree and was repaired". Re-look
                at AR-TICK-1118-01 (docs/security/accepted-risks.md).
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_drift_repairs_total{job="nava",instance="nava-groupsync:9090"}'
        values: '3+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts: []
  # A series that first appears already at 1 (first repair after a restart).
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_drift_repairs_total{job="nava",instance="nava-groupsync:9090"}'
        values: '_x5 1x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nava
              instance: nava-groupsync:9090
            exp_annotations:
              summary: Group sync found the stored org closure different from the live org tree and repaired it.
              description: >-
                Find the tenant in the nava-groupsync log line "the stored org
                closure differed from the live org tree and was repaired". Re-look
                at AR-TICK-1118-01 (docs/security/accepted-risks.md).
      - eval_time: 35m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts: []
  # A failed scrape is not a repair.
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_drift_repairs_total{job="nava",instance="nava-groupsync:9090"}'
        values: '1x60 stale 1x60'
    alert_rule_test:
      - eval_time: 76m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'groupsync_org_closure_drift_repairs_total{job="nava",instance="nava-groupsync:9090"}'
        values: '1x60 stale _x9 1x60'
    alert_rule_test:
      - eval_time: 80m
        alertname: GroupsyncOrgClosureDriftRepaired
        exp_alerts: []

# nava-core exports OTLP/HTTP traces and logs here. The debug exporter is the only
# destination until a trace backend is chosen.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Second layer behind the in-process allow-list in
  # internal/platform/telemetry/filter.go. TestCollectorDenyListMatchesFilter
  # fails when the two drift. The traces and logs pipelines both use this one
  # processor, so there is a single deny-list for both signals. On logs it
  # deletes the keys from log record attributes.
  attributes/deny:
    actions:
      - {key: url.path, action: delete}
      - {key: url.query, action: delete}
      - {key: url.full, action: delete}
      - {key: http.url, action: delete}
      - {key: http.target, action: delete}
      - {key: user_agent.original, action: delete}
      - {key: http.user_agent, action: delete}
      - {key: client.address, action: delete}
      - {key: client.port, action: delete}
      - {key: http.client_ip, action: delete}
      - {key: network.peer.address, action: delete}
      - {key: network.peer.port, action: delete}
      - {key: net.sock.peer.addr, action: delete}
      - {key: net.peer.ip, action: delete}
      - {key: server.port, action: delete}
      - {key: http.request.method_original, action: delete}
      - {key: network.protocol.version, action: delete}
      - {key: db.query.text, action: delete}
      - {key: db.statement, action: delete}
      - {key: exception.message, action: delete}
      - {pattern: ^http\.request\.header\..*, action: delete}
  # The attributes processor reaches span attributes only. filter.go also
  # filters span events (RecordError puts exception.message there), drops the
  # status description. Link tracestate is stripped in-process only: OTTL cannot
  # edit links.
  transform/deny:
    error_mode: propagate
    trace_statements:
      - context: spanevent
        statements:
          - delete_key(attributes, "url.path")
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "user_agent.original")
          - delete_key(attributes, "http.user_agent")
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "client.port")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "network.peer.address")
          - delete_key(attributes, "network.peer.port")
          - delete_key(attributes, "net.sock.peer.addr")
          - delete_key(attributes, "net.peer.ip")
          - delete_key(attributes, "server.port")
          - delete_key(attributes, "http.request.method_original")
          - delete_key(attributes, "network.protocol.version")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "exception.message")
          - delete_matching_keys(attributes, "^http\\.request\\.header\\..*")
      - context: span
        statements:
          - set(status.message, "")
  # Keep every error and every slow request; sample the rest.
  tail_sampling:
    decision_wait: 2s
    num_traces: 10000
    policies:
      - name: errors
        type: status_code
        status_code: {status_codes: [ERROR]}
      - name: slow
        type: latency
        latency: {threshold_ms: 500}
      - name: sample-the-rest
        type: probabilistic
        probabilistic: {sampling_percentage: "${env:OTEL_TAIL_SAMPLE_PERCENT:-10}"}
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/deny, transform/deny, tail_sampling, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/deny, batch]
      exporters: [debug]

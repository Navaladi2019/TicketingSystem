# Agroal pool settings Keycloak has no KC_DB_POOL_* option for (TICK-328, R4).
# After a PostgreSQL restart Keycloak kept its dead connections and refused
# every token while /health/ready stayed 200.
# Validate a connection on every borrow, and in the background, and drop it
# when it fails; recycle idle and old connections.
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.foreground-validation-interval=0S
quarkus.datasource.jdbc.background-validation-interval=10S
quarkus.datasource.jdbc.idle-removal-interval=30S
quarkus.datasource.jdbc.max-lifetime=5M
# /health/ready then includes a database check.
quarkus.datasource.health.enabled=true

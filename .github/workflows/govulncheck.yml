# TICK-641: govulncheck as a pipeline of its own, out of the ci workflow's
# lint and temporal-server jobs. Both modules (the root and temporal-server/,
# separate go.mod files) are scanned in parallel, and each must report zero
# findings: no exception and no allowlist (ADR-001 A1 Decision 3).
#
# When it runs (TICK-694, the owner's request: every 2 days, not every PR):
#   schedule      03:17 UTC on every second day of the month ('17 3 */2 * *';
#                 a 31-day month runs on the 31st and the 1st): a new advisory
#                 needs no change of ours (ADR-001-A1 R7).
#   pull_request  only when it changes go.mod or go.sum of either module: a
#                 new or bumped dependency is how a known-vulnerable module
#                 enters main (ADR-001-A1 Decision 3, zero findings). Not a
#                 required check of main, so the paths filter blocks no merge.
#                 Every other pull request skips it.
#   workflow_dispatch  by hand.
# No push trigger: a merge is scanned by its pull request (when it changed a
# dependency) and by the next scheduled run.
# A failed scheduled run on main opens or updates the P0 "main is red" issue
# (scripts/ci/main-red.sh). Always GitHub-hosted: no Docker, nothing the
# self-hosted runner would speed up. Every step is a make target:
# `make tools-govulncheck vulncheck vulncheck-temporal-server` runs it locally.
# The steps below are kept by make check-ci-steps
# (tools/ci/cisteps/required-govulncheck.yaml).
name: govulncheck

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - go.mod
      - go.sum
      - temporal-server/go.mod
      - temporal-server/go.sum
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its older run; scheduled and manual runs never
# cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('govulncheck-{0}', github.ref) || format('govulncheck-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install govulncheck
        run: make tools-govulncheck
      - name: govulncheck (root module)
        run: make vulncheck

  temporal-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: temporal-server/go.mod
          cache: false
      - name: Install govulncheck
        run: make tools-govulncheck
      - name: govulncheck (temporal-server)
        run: make vulncheck-temporal-server

  main-red:
    needs: [root, temporal-server]
    if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the P0 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: govulncheck
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: sh scripts/ci/main-red.sh

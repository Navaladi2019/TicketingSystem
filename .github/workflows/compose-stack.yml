name: compose-stack

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # db-roles, the migrator and the grant manifest against a real, disposable
  # PostgreSQL (internal/db/dbtest).
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: pgadmin
          POSTGRES_PASSWORD: ci-only-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pgadmin" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      NAVA_TEST_PG_URL: postgres://pgadmin:ci-only-superuser@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: make test-integration

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # An ordinary 404 is sampled out at the default 10%; keep all for the trace test.
      OTEL_TAIL_SAMPLE_PERCENT: "100"
      # The stack tests run with the operator profile (Temporal UI) and the test overlay.
      COMPOSE_FILE_ARGS: --profile operator -f compose.yaml -f deploy/compose/compose.test.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: No floating image tags
        run: |
          files="compose.yaml deploy/compose/compose.internal.yaml deploy/compose/compose.test.yaml deploy/compose/otel-collector/Dockerfile deploy/compose/nava-core/Dockerfile deploy/compose/nava-db/Dockerfile"
          if grep -En '^\s*(image:\s*|FROM\s+)[^:[:space:]]+(\s|$)' $files; then echo 'image without an exact tag'; exit 1; fi
          if grep -n ':latest' $files; then echo 'latest is not allowed'; exit 1; fi

      - name: Build and start the stack
        run: |
          make dev-ca
          docker compose --profile operator -f compose.yaml -f deploy/compose/compose.test.yaml up -d --build

      - name: Every container healthy
        run: sh deploy/compose/test/stack-test.sh healthy

      - name: PgBouncer settings
        run: sh deploy/compose/test/stack-test.sh pgbouncer

      - name: Keycloak and Temporal databases
        run: sh deploy/compose/test/stack-test.sh temporal

      - name: Temporal handshake (rogue CA refused)
        run: sh deploy/compose/test/stack-test.sh temporal_handshake

      - name: Temporal internal ports unreachable from the platform network
        run: sh deploy/compose/test/stack-test.sh temporal_isolation

      - name: Temporal certificates mounted only where owned
        run: sh deploy/compose/test/stack-test.sh temporal_custody

      - name: No platform process reaches the Temporal UI
        run: sh deploy/compose/test/stack-test.sh temporal_operator_reach

      - name: Temporal bootstrapped, nava-core healthz ok over mTLS
        run: sh deploy/compose/test/stack-test.sh temporal_health

      - name: SDK clients dial with their certificates and a worker runs
        run: go test -tags temporalstack -count=1 ./internal/temporalstack

      - name: One request, one trace
        run: sh deploy/compose/test/stack-test.sh trace

      - name: Collector redacts denied span values
        run: sh deploy/compose/test/stack-test.sh redact

      - name: db-roles and migrate are idempotent
        run: sh deploy/compose/test/stack-test.sh idempotent

      - name: db-roles revokes stray memberships
        run: sh deploy/compose/test/stack-test.sh dbroles

      - name: Internal overlay comes up
        run: |
          docker compose --profile operator down -v
          sh deploy/compose/test/stack-test.sh internal

      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f deploy/compose/compose.internal.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

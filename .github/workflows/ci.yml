# T05 pipeline. Every step calls a Makefile target, so `make ci` runs the same
# gates locally. The jobs run in parallel; inside each, steps run in the
# Makefile's gate order and the first failure stops the job:
#   lint             gofmt, go vet, golangci-lint, fixtures, pins, OpenAPI,
#                    govulncheck (no containers)
#   unit             go test -race (no containers)
#   temporal-server  the custom server module's unit tests and govulncheck
#                    (no containers)
#   integration      -tags integration against a throwaway PostgreSQL, the
#                    isolation suite, then the ci-isolated --down tag check
#   stack            image build, compose up, smoke, platform and Temporal tests
#   stack-db         a second stack: db-roles/migrate idempotency, role and hba tests
#   stack-internal   the internal overlay on a fresh stack
# A pull request runs only the jobs its change needs: the changes job asks
# `make ci-stages` (tools/ci/cichanged, the rules of `make ci-changed`), lint
# always runs, and a change under .github/workflows runs everything. A push to
# main or to a TICK-** branch runs every job on the merged tree (TICK-289),
# and a red push to main opens a P0 issue (main-red). Run the full pipeline by
# hand from the Actions tab (workflow_dispatch) on any branch.
# Budget: see "Job time budgets" in docs/quality/ci-pipeline.md. The three
# stack jobs build the images first (7.5 to 10 minutes of each run), so their
# timeout-minutes is 25 (TICK-258); the others stay at 10. Each job keeps its
# own Go build cache (key per job, refreshed every run), the CI tools are cached
# by version, and image layers live in the Actions cache (gha).
name: ci

on:
  pull_request:
  push:
    # 'TICK-**' (** crosses /) matches story branches (TICK-<story>/<slug>)
    # and task branches alike: a glob cannot tell them apart, and the extra
    # runs on task branches are an accepted cost (TICK-289).
    branches: [main, 'TICK-**']
  workflow_dispatch:

permissions:
  contents: read

# A push gets a group of its own (per ref and sha), so a newer merge neither
# cancels nor replaces a queued run: GitHub keeps one pending run per group even
# with cancel-in-progress off. The ref keeps the same sha pushed to main and to
# a TICK-** branch from sharing a group. Pull requests still cancel their older
# run.
concurrency:
  group: ${{ github.event_name == 'push' && format('ci-push-{0}-{1}', github.ref, github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Which of unit, integration and the stack jobs this change needs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.stages.outputs.unit }}
      integration: ${{ steps.stages.outputs.integration }}
      stack: ${{ steps.stages.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - name: Stages this change needs
        id: stages
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
          # Every stage on a manual run and on a push: a merge result has no
          # meaningful diff base.
          CI_ALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: make ci-stages

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # check-openapi and review-paths diff against the pull request's base.
      BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - name: Cache pinned tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: tools-${{ hashFiles('Makefile') }}
      - name: Install pinned tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: make tools
      - name: Review paths (D-P10)
        if: github.event_name == 'pull_request'
        run: make review-paths
      - name: Tool versions
        run: make check-tools
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: golangci-lint
        run: make lint
      - name: Lint fixture (exact forbidigo finding count)
        run: make lint-fixture
      - name: Taskfile matches Makefile
        run: make check-taskfile
      - name: Pins and forbidden modules
        run: make check-pins
      - name: OpenAPI additive-only
        run: make check-openapi
      - name: govulncheck
        run: make vulncheck

  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # TestNewMigrationsLaterThanBase compares added migrations with main's
      # newest (TICK-299), so the checkout needs main's history. Always main,
      # even for a pull request into a story branch: only migrations that
      # have shipped bind deployed databases (TICK-309).
      BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - name: go test -race
        run: make test

  temporal-server:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: temporal-server/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - name: temporal-server unit tests
        run: make temporal-server-test
      - name: Install govulncheck
        run: make tools-govulncheck
      # ADR-001 A1 Decision 3: zero findings, no exception and no allowlist.
      - name: govulncheck (temporal-server)
        run: make vulncheck-temporal-server

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - name: Integration tests (-tags integration)
        run: make test-integration
      # Its own step, not part of make test-integration (TICK-224).
      - name: ci-isolated --down untags only its own tags
        run: make test-ci-isolated-down
      # Its own step too (TICK-185): a run with ARGS or a TERM part way
      # leaves no nava-it-* container or network.
      - name: Integration script leaves nothing behind
        run: make test-integration-cleanup
      - name: Isolation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-report
          path: isolation-report.md
          if-no-files-found: error

  stack:
    # Platform and Temporal stack tests; the database tests run in stack-db.
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build images (layer cache in gha)
        run: make image-ci
      - name: Start the stack
        run: make stack-up
      - name: Every container healthy
        run: make stack-test-healthy
      - name: Compose smoke, GET /healthz from the compose network
        run: make smoke
      - name: PgBouncer settings
        run: make stack-test-pgbouncer
      - name: Keycloak and Temporal databases
        run: make stack-test-temporal
      - name: Temporal handshake (rogue CA refused)
        run: make stack-test-temporal_handshake
      - name: Temporal internal ports unreachable from the platform network
        run: make stack-test-temporal_isolation
      - name: Temporal certificates mounted only where owned
        run: make stack-test-temporal_custody
      - name: No platform process reaches the Temporal UI
        run: make stack-test-temporal_operator_reach
      - name: Temporal bootstrapped, nava-core healthz ok over mTLS
        run: make stack-test-temporal_health
      - name: SDK clients dial with their certificates and a worker runs
        run: make stack-test-sdk
      # The CI-6 and CI-7 report stack-test-sdk writes (TICK-49 acceptance).
      - name: CI-6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci6-report
          path: ci6-report.md
          if-no-files-found: error
      # Before the dependency probes, which stop Keycloak.
      - name: Realm nava, operator custody and the Keycloak adapter
        run: make stack-test-identity
      - name: CI-5 adversarial identity suite (T19)
        run: make identity-attacks
      - name: CI-5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci5-report
          path: ci5-report.md
          if-no-files-found: error
      # After the SDK suite: the worker polls nava-tq, the queue its workers poll.
      - name: nava-worker ready, admin listener, guarded activity
        run: make stack-test-worker
      - name: S7 demo, make demo-outbox twice with one key, one workflow and two signals
        run: make stack-test-demo_outbox
      - name: Dependency probes, /readyz 200 with Keycloak stopped
        run: make stack-test-dependencies
      - name: One request, one trace
        run: make stack-test-trace
      - name: Exported logs reach the Collector
        run: make stack-test-logs
      - name: Collector redacts denied span values
        run: make stack-test-redact
      - name: Logs on failure
        if: failure()
        run: make stack-logs
      - name: Tear down
        if: always()
        run: make stack-down

  stack-db:
    # Database stack tests on their own stack, beside stack.
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build images (layer cache in gha)
        run: make image-ci
      - name: Start the stack
        run: make stack-up
      - name: Every container healthy
        run: make stack-test-healthy
      - name: db-roles and migrate are idempotent
        run: make stack-test-idempotent
      - name: db-roles revokes stray memberships
        run: make stack-test-dbroles
      - name: pg_hba keeps pgadmin and nava_backup out
        run: make stack-test-hba
      - name: Logs on failure
        if: failure()
        run: make stack-logs
      - name: Tear down
        if: always()
        run: make stack-down

  stack-internal:
    # The internal overlay brings up its own stack, so it runs beside stack.
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_CACHE: gha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ github.job }}-${{ hashFiles('**/go.sum') }}-
            go-${{ github.job }}-
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build images (layer cache in gha)
        run: make image-ci
      - name: Dev installation CA
        run: make dev-ca
      - name: Internal overlay comes up
        run: make stack-internal
      - name: Logs on failure
        if: failure()
        run: make stack-logs
      - name: Tear down
        if: always()
        run: make stack-down

  main-red:
    # A push to main with any failed job opens (or comments on) the P0
    # "main is red" issue. A skipped job is not a failure; a cancelled run
    # does not fire this.
    needs: [changes, lint, unit, temporal-server, integration, stack, stack-db, stack-internal]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open or update the P0 issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: sh scripts/ci/main-red.sh

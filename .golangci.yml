version: "2"

run:
  go: "1.26"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gochecknoglobals # config and state go through constructors, never globals
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
  settings:
    forbidigo:
      # Outbound calls go through telemetry.NewOutboundClient (timeouts, URL
      # redaction, no query or email in spans). A raw client skips all three.
      analyze-types: true # match by package, so aliased imports are caught too
      forbid:
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Head|Post|PostForm|Client|Transport)$
          pkg: ^net/http$
          msg: use telemetry.NewOutboundClient
    sloglint:
      attr-only: true # slog.String(...) attributes, never loose key/value pairs
      context: all # *Context methods only, so every line carries the request ids
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
      - path: ^internal/platform/telemetry/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^docs/ # ADR spike evidence, kept byte-for-byte as recorded
  settings:
    goimports:
      local-prefixes:
        - github.com/Navaladi2019/TicketingSystem

version: "2"

run:
  go: "1.26"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gochecknoglobals # config and state go through constructors, never globals
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
    depguard:
      rules:
        # CI-11 import rule (D-P6, TICK-94 item 15): only the Keycloak adapter
        # imports a Keycloak client or a JWT/JWKS library; everything else
        # goes through the identity port. depguard sees direct imports only,
        # so a re-exporting wrapper gets around it; the contract suite
        # (internal/identity/contracttest) is the backstop.
        identity-port:
          files:
            - "$all"
            - "!**/internal/identity/keycloak/**"
          deny:
            - pkg: github.com/lestrrat-go/jwx
              desc: tokens are validated only in internal/identity/keycloak; use identity.IdentityResolver or identity.OperatorResolver
            - pkg: github.com/lestrrat-go/httprc
              desc: the JWKS cache lives only in internal/identity/keycloak
            - pkg: github.com/Nerzal/gocloak
              desc: forbidden (TICK-94 item 12); the Keycloak client lives in internal/identity/keycloak
            - pkg: github.com/coreos/go-oidc
              desc: forbidden (TICK-94 item 11)
    forbidigo:
      # Outbound calls go through telemetry.NewOutboundClient (timeouts, URL
      # redaction, no query or email in spans). A raw client skips all three.
      analyze-types: true # match by package, so aliased imports are caught too
      forbid:
        - pattern: ^http\.(DefaultClient|DefaultTransport|Get|Head|Post|PostForm|Client|Transport)$
          pkg: ^net/http$
          msg: use telemetry.NewOutboundClient
        # Bind parameters (tenant data, emails) as span attributes (TICK-94 item 4).
        - pattern: ^otelpgx\.WithIncludeQueryParameters$
          pkg: ^github\.com/exaring/otelpgx$
          msg: query parameters must not reach spans; db.NewPool traces without them
        # ADR-002: group paths are display-only; only GetMe reads them.
        - pattern: ^identity\.GroupPathReader\.GroupPaths$
          pkg: ^github\.com/Navaladi2019/TicketingSystem/internal/identity$
          msg: group paths are display-only (ADR-002); only GetMe may call GroupPaths
        - pattern: ^pgstore\.Store\.GroupPaths$
          pkg: ^github\.com/Navaladi2019/TicketingSystem/internal/identity/pgstore$
          msg: group paths are display-only (ADR-002); only GetMe may call GroupPaths
    sloglint:
      attr-only: true # slog.String(...) attributes, never loose key/value pairs
      context: all # *Context methods only, so every line carries the request ids
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, forbidigo]
      - path: ^internal/platform/telemetry/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^docs/ # ADR spike evidence, kept byte-for-byte as recorded
  settings:
    goimports:
      local-prefixes:
        - github.com/Navaladi2019/TicketingSystem

# Local task runner (go-task v3, https://taskfile.dev), handy on Windows hosts
# without make. Keep these commands in step with the Makefile, which stays the
# CI entry point (T05).
version: "3"

# Loaded only when present; copy .env.example to .env. Variables already set in
# the shell take precedence.
dotenv: [".env"]

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the nava-core binary into bin/
    cmds:
      - go build -o bin/nava-core{{exeExt}} ./cmd/nava-core

  run:
    desc: Run nava-core locally with .env loaded (Ctrl+C shuts it down gracefully)
    cmds:
      - go run ./cmd/nava-core

  test:
    desc: Run all tests with the race detector (needs cgo), navalint's included, one race run per host at a time, failing when a registered isolation suite ran zero tests, the same as make test
    cmds:
      - go run ./tools/ci/racelock -- go run ./tools/ci/suiteran -- go test -json -race -trimpath ./...
      - go run ./tools/ci/racelock -- go -C tools/navalint test -race ./...

  test:short:
    desc: Run all tests without the race detector, for hosts with no cgo
    cmds:
      - go test ./...
      - go -C tools/navalint test ./...

  test:integration:
    desc: Run every integration-tagged test against a throwaway postgres container (needs Docker), the same as make test-integration
    cmds:
      - sh scripts/ci/test-integration.sh

  bench:relay:
    desc: Run the relay claim-latency benchmark (T33, report-only) against a throwaway postgres container (needs Docker), the same as make bench-relay
    cmds:
      - sh scripts/ci/test-integration.sh -run '^$' -bench '^BenchmarkClaim$' -benchtime 200x

  lint:
    desc: Run golangci-lint, then the navalint analyzers (set_config outside internal/tenancy), then the ADR-002-E1 nolint allow-list gate, then the decision-log index check, then the duplicate-id check (the OpenAPI regenerate-and-diff gate is check-generate, not lint)
    cmds:
      - golangci-lint run ./...
      - sh scripts/ci/navalint.sh
      - sh scripts/ci/nolint-allowlist.sh
      - go run ./tools/docindex -check
      - go run ./tools/dupids

  vet:tags:
    desc: Run go vet once per build-tag set the //go:build lines use, so a tagged test that stops compiling fails (TICK-320), the same as make vet-tags
    cmds:
      - go run ./tools/ci/buildtags

  lint:fixture:
    desc: The forbidigo and navalint rules must report exactly their fixture findings
    cmds:
      - sh scripts/ci/lint-fixture.sh

  check-taskfile:
    desc: Fail if a Taskfile task (build, test, lint) drifts from its Makefile twin (needs make)
    cmds:
      - go run ./tools/ci/checktaskfile

  check-pins:
    desc: Fail if a go.mod require or an image has no row in docs/pins.md, or a forbidden module is in the graph
    cmds:
      - go run ./tools/ci/checkpins

  vulncheck:
    desc: Run govulncheck on the platform module (install it with make tools)
    cmds:
      - govulncheck ./...

  generate:
    desc: Bundle api/openapi.yaml + api/paths/*.yaml and regenerate api/api.gen.go (oapi-codegen, pinned by the go.mod tool directive)
    cmds:
      - go generate ./...

  check-openapi:
    desc: Fail if the api bundle removes or narrows anything on origin/main (additive-only rule for /api/v1)
    cmds:
      - sh scripts/ci/check-openapi.sh origin/main

  ci:isolated:
    desc: "Run make ci on a stack of its own (project nava-ID, image tag ID, own ports), the same as make ci-isolated; task ci:isolated ID=<pr-or-sha>"
    requires:
      vars: [ID]
    cmds:
      - sh scripts/ci/ci-isolated.sh {{.ID}}

  ci:changed:
    desc: "Run ci:isolated with only the stages the change against origin/main needs, the same as make ci-changed; task ci:changed ID=<pr-or-sha>"
    requires:
      vars: [ID]
    cmds:
      - stages=$(go run ./tools/ci/cichanged -v) && STAGES="$stages" sh scripts/ci/ci-isolated.sh {{.ID}}

  ci:isolated:down:
    desc: "Tear down what a killed ci:isolated run left (its own project and image tags), the same as make ci-isolated-down"
    requires:
      vars: [ID]
    cmds:
      - sh scripts/ci/ci-isolated.sh --down {{.ID}}

  reap:integration:
    desc: "Remove the nava-it-*/nava-iso-* containers and networks killed integration runs left, older than REAP_OLDER (default 6h), never a compose stack; REAP_DRY=1 lists them only. The same as make reap-integration"
    cmds:
      - go run ./tools/ci/itreap -older {{.REAP_OLDER | default "6h"}} {{if .REAP_DRY}}-n{{end}}

  stack:up:
    desc: Build and start the local compose stack (Postgres, PgBouncer, Keycloak, Temporal, Collector, nava-core, Jaeger on 127.0.0.1:16686, Prometheus on 127.0.0.1:9091)
    cmds:
      - make dev-ca
      - docker compose --profile operator up -d --build

  stack:down:
    desc: Stop the local compose stack and delete its volumes
    cmds:
      - docker compose --profile operator down -v

  stack:test:
    desc: Run the stack tests against a running stack (set OTEL_TAIL_SAMPLE_PERCENT=100 when starting it for the trace test)
    cmds:
      - for: [healthy, smoke, pgbouncer, temporal, temporal_handshake, temporal_isolation, temporal_custody, temporal_operator_reach, temporal_health, dependencies, trace, logs, redact, idempotent, dbroles, hba]
        cmd: sh deploy/compose/test/stack-test.sh {{.ITEM}}

  demo:outbox:
    desc: "S7 demo, the same as make demo-outbox: a start row and two signal rows for tenant-a through outbox.Enqueue, one workflow; task demo:outbox DEDUPE_KEY=<key> (needs the stack up)"
    cmds:
      - sh scripts/dev/demo-outbox.sh
    env:
      DEDUPE_KEY: '{{.DEDUPE_KEY | default "demo-outbox"}}'

# Local task runner (go-task v3, https://taskfile.dev), handy on Windows hosts
# without make. Keep these commands in step with the Makefile, which stays the
# CI entry point (T05).
version: "3"

# Loaded only when present; copy .env.example to .env. Variables already set in
# the shell take precedence.
dotenv: [".env"]

tasks:
  default:
    desc: List the available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the nava-core binary into bin/
    cmds:
      - go build -o bin/nava-core{{exeExt}} ./cmd/nava-core

  run:
    desc: Run nava-core locally with .env loaded (Ctrl+C shuts it down gracefully)
    cmds:
      - go run ./cmd/nava-core

  test:
    desc: Run all tests with the race detector (needs cgo), the same as make test
    cmds:
      - go test -race ./...

  test:short:
    desc: Run all tests without the race detector, for hosts with no cgo
    cmds:
      - go test ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fixture:
    desc: The forbidigo rule must report exactly 5 findings on the raw HTTP client fixtures
    cmds:
      - |
        code=0; out=$(golangci-lint run --build-tags lintfixture ./internal/platform/lintfixture/ 2>&1) || code=$?
        echo "$out"
        test "$code" -eq 1 || { echo "lint:fixture: expected exit 1, got $code"; exit 1; }
        n=$(echo "$out" | grep -c "(forbidigo)$" || true)
        test "$n" -eq 5 || { echo "lint:fixture: expected 5 forbidigo findings, got $n"; exit 1; }

  generate:
    desc: Regenerate api/api.gen.go from api/openapi.yaml (oapi-codegen, pinned by the go.mod tool directive)
    cmds:
      - go generate ./...

  check-openapi:
    desc: Fail if api/openapi.yaml removes or narrows anything on origin/main (additive-only rule for /api/v1)
    cmds:
      - git show origin/main:api/openapi.yaml > {{.TMP}}/openapi.base.yaml
      - go run ./cmd/openapi-compat {{.TMP}}/openapi.base.yaml api/openapi.yaml
    vars:
      TMP: '{{.TEMP | default "/tmp"}}'

  stack:up:
    desc: Build and start the local compose stack (Postgres, PgBouncer, Keycloak, Temporal, Collector, nava-core)
    cmds:
      - docker compose up -d --build

  stack:down:
    desc: Stop the local compose stack and delete its volumes
    cmds:
      - docker compose down -v

  stack:test:
    desc: Run the stack tests against a running stack (set OTEL_TAIL_SAMPLE_PERCENT=100 when starting it for the trace test)
    cmds:
      - for: [healthy, pgbouncer, temporal, trace, redact, idempotent]
        cmd: sh deploy/compose/test/stack-test.sh {{.ITEM}}

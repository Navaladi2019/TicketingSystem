; The bench pooler: the settings of deploy/compose/pgbouncer/pgbouncer.ini
; (transaction mode, max_prepared_statements), a plain userlist for nava_app.
[databases]
nava = host=PGHOST port=5432 dbname=nava

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 100
default_pool_size = 20
max_client_conn = 200
ignore_startup_parameters = extra_float_digits

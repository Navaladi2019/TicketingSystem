# The audited-tables manifest (ADR-004 decision 2, R12; PLAN-005 P5-11).
# Read through internal/platform/strictyaml by internal/db/audited: unknown
# keys, duplicate keys and a second document are errors.
#
# Every tenant table is listed exactly once, under `audited` or under
# `exempt` with a reason. CI-A3 (the catalogue test, and the gate at the end
# of every `nava-db migrate`) fails on a tenant table that is in neither.
# Partitions are covered by their partitioned parent.
#
# audited: <table>:
#   writer_roles:      every role that may INSERT, UPDATE or DELETE the table.
#                      `nava-db migrate` generates, for each, INSERT on the
#                      R10 audit_log columns, SELECT on the commit-check
#                      columns and the audit_log SELECT and INSERT policies
#                      (canonical; pinned provisioning predicate for
#                      nava_onboard). Must equal the roles the catalogue
#                      shows writing the table.
#   audited_columns:   the UPDATE OF list of the commit-check trigger. Must
#                      cover every column any role may UPDATE. Empty for an
#                      insert-only table (the trigger then has no UPDATE event).
#   subject_type:      the entry's subject_type (internal/audit/subjects.go).
#   subject_id_column: the uuid column whose value is the entry's subject_id.
#   attached:          true once a migration has attached audit_commit_check
#                      to the table. CI-A3 fails on a trigger on a table not
#                      marked true, and on a table marked true without one.
#
# exempt: <table>: { reason: "..." }  A non-empty reason is required.
#
# Adding, removing or exempting a table is a security-review change (D-P10).

audited:
  # Attached by P5-13c (TICK-530, 20261104110000) after ADR-004-E5 step (ii):
  # the groups FK is ON DELETE RESTRICT (TICK-538, R29), so no FK action
  # rewrites records.
  # The columns are every column a writer may UPDATE (db/grants.yaml).
  records:
    writer_roles: [nava_app, nava_worker]
    audited_columns: [version, schema_version, state, requester_id, assignee_id, assignment_group_id,
                      updated_at, data, causation_origin_id, causation_depth]
    subject_type: record
    subject_id_column: id
    attached: true
  # Attached by P5-32 (migration B, TICK-442, 20261107053707, D-5-8); P5-14
  # makes the S8 publish path write their entries. numbering_mode joins the
  # UPDATE OF list in 20261110040000 (P3-36f, TICK-659).
  entity_definitions:
    writer_roles: [nava_app, nava_onboard]
    audited_columns: [current_version, updated_at, numbering_mode]
    subject_type: entity_definition
    subject_id_column: id
    attached: true
  entity_definition_versions:
    writer_roles: [nava_app, nava_onboard]
    audited_columns: []
    subject_type: entity_definition
    subject_id_column: definition_id
    attached: true
  # P3-30 (TICK-615): insert-only. Publishing an ACL changes the entity
  # type's configuration, so it is audited under its own subject, acl_policy
  # (A3: not entity_definition, whose version chain is the schema's). Attached by
  # P3-35 (TICK-620, 20261109120000): the publish route and the default
  # incident ACL (onboarding, nava-onboard reconcile-default-acl) are the
  # writers, and each writes its entry in the same transaction
  # (authz.PolicyStore.Publish).
  acl_versions:
    writer_roles: [nava_app, nava_worker]
    audited_columns: []
    subject_type: acl_policy
    subject_id_column: entity_definition_id
    attached: true
  # P3-30 (TICK-615): insert-only. A share changes who may see a record. Not
  # attached yet: nothing writes record_shares until the share route, and the
  # task that adds it writes its audit entry and attaches the trigger with it.
  record_shares:
    writer_roles: [nava_app, nava_worker]
    audited_columns: []
    subject_type: record
    subject_id_column: record_id
    attached: false

exempt:
  audit_log:
    reason: "The audit log itself (ADR-004 decision 1); R10 and R11 guard its writes."
  audit_chain_head:
    reason: "Chain state (R14). A seal is visible in the sealed entries; reseed and export write their own audit entries (R17, R19)."
  record_write_keys:
    reason: "Dedupe index of a write that is already audited (PLAN-005 D-5-3)."
  record_counters:
    reason: "Record-number counter (D-3-9); the record insert that takes the number is audited."
  outbox:
    reason: "Start transport (ADR-001 D22); the write that queues a start is audited, the relay's dispatch columns are bookkeeping."
  workflow_ref:
    reason: "Workflow bookkeeping for a start the audited write queued; holds no record or configuration content."
  cascade_start:
    reason: "Cascade start key (A5). A suppressed or rejected cascade is audited as a cascade_key entry by the pipeline (ADR-004-E1)."
  idempotency_keys:
    reason: "HTTP replay cache; the write it replays is audited."
  tenants:
    reason: "Tenant lifecycle, written by onboarding. R2 has no tenant subject type; the epic that audits onboarding registers one (I8)."
  tenant_identity_binding:
    reason: "Onboarding's binding to the identity provider. R2 has no subject type for it (I8)."
  tenant_email_domain:
    reason: "Onboarding's email-domain claims. R2 has no subject type for them (I8)."
  pending_invite:
    reason: "Onboarding invites. R2 has no subject type for them (I8)."
  tenant_admin_group:
    reason: "Pointer to the tenant's admins group, set once by onboarding. R2 has no subject type for it (I8)."
  tenant_auditor_group:
    reason: "Pointer to the tenant's auditors group, set once by onboarding. R2 has no subject type for it (I8)."
  principals:
    reason: "Mirror of the identity provider written by group sync (T16); Keycloak holds the source and its event log. R2 has no subject type for it (I8)."
  groups:
    reason: "Mirror of the identity provider written by group sync (T16). R2 has no subject type for it (I8)."
  group_members:
    reason: "Mirror of the identity provider written by group sync (T16). R2 has no subject type for it (I8)."
  org_units:
    reason: "Mirror of the identity provider written by group sync (T16). R2 has no subject type for it (I8)."

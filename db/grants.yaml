# The single grant manifest (ADR-001 I3, A.3; PLAN-001 D-P2). Nothing else
# grants privileges. Read by two jobs through internal/platform/strictyaml
# (unknown keys, duplicate keys and a second document are errors):
#
#   db-roles (bootstrap superuser): creates or alters every role under `roles`
#     (always NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS, plus the listed
#     `attributes`), revokes every role membership this file does not list
#     (it lists none), creates `databases` with their owners, and converges the
#     `infrastructure_exceptions`.
#   migrate (nava_migrator, after the migrations): grants on the platform
#     database what each role lists below, and revokes and logs anything else
#     granted on an object nava_migrator owns, PUBLIC included.
#
# Per role:
#   attributes:      LOGIN and/or REPLICATION; anything not listed is off.
#   pgbouncer_login: true puts the role on PgBouncer's login allow-list.
#   database:        privileges on the platform database (CONNECT, TEMPORARY, CREATE).
#   schemas:         schema -> privileges (USAGE, CREATE).
#   tables:          table -> privilege -> columns. An empty list is a
#                    table-level grant; a list grants only those columns.
#                    A bare name is in schema public.
#   functions:       "schema.name(argtypes)" -> [EXECUTE].
#   settings:        role-wide parameters (ALTER ROLE ... SET), converged by
#                    db-roles: a parameter set on the role but not listed is
#                    reset. Only the parameters grants.AllowedSettings knows.
# Each table's entries ship with the migration that creates that table.
# Policies stay in SQL migrations. One exception (ADR-004 R12, P5-11): every
# writer role of an audited table gets its audit_log grants and policies
# generated from db/audited-tables.yaml; `nava-db migrate` merges those
# grants into this file's before applying it.

platform_database: nava

databases:
  nava: { owner: nava_migrator }
  keycloak: { owner: keycloak }
  temporal: { owner: temporal }
  temporal_visibility: { owner: temporal }

roles:
  # Owns every platform object and the database (datdba); granted to no one;
  # connects directly to PostgreSQL, never through PgBouncer.
  nava_migrator:
    attributes: [LOGIN]

  # The D28 system actors (A.3), one role each. Table entries: T09
  # (00002_platform_tables.sql), T16 (00003_identity_tables.sql), T18a
  # (00004_tenant_email_domain.sql, 00007_email_domain_release.sql), T252a
  # (00006_pending_invite.sql), P3-02 (20261031150000_entity_definitions.sql)
  # and P3-09 (20261101190000_records_pipeline.sql).
  # Every tenant table is under FORCE RLS, so a grant here reaches only the
  # rows its policies allow.
  nava_app:
    attributes: [LOGIN]
    pgbouncer_login: true
    # P3-01 (TICK-339): list queries plan with the tenant's own values; the
    # generic plan of query (d) missed 150 ms at p95 398 ms. db-roles applies it.
    settings: { plan_cache_mode: force_custom_plan }
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenants: { SELECT: [id, state] }
      tenant_identity_binding: { SELECT: [tenant_id, issuer, org_id, idp_aliases] } # binding_lookup
      # P3-09 (TICK-353): UPDATE leaves out tenant_id, id and the columns set
      # once at insert (entity_definition_id, number, created_by, created_at),
      # so a record's number cannot be rewritten.
      records:
        SELECT: []
        INSERT: []
        UPDATE: [version, schema_version, state, requester_id, assignee_id, assignment_group_id,
                 updated_at, data, causation_origin_id, causation_depth]
      # audit_log: as a writer of an audited table, its INSERT on the R10
      # columns and SELECT on the commit-check columns are generated from
      # db/audited-tables.yaml (R12, P5-11). The list below is every column
      # the audit read endpoints return (P5-17, R8) but diff and diff_salt:
      # since ADR-004-A1 (A1-2) only nava_audit_reader reads those, so any
      # nava_app query that names them gets 42501. Never the seal columns'
      # UPDATE.
      audit_log:
        SELECT: [tenant_id, id, occurred_at, txid, domain, action, subject_type, subject_id, entity_definition_id,
                 version_before, version_after, actor_principal_id, actor_system, source, source_ref,
                 change_set_id, causation_id, causation_depth, request_id, backfilled, content_sha256,
                 diff_sha256, diff_truncated, seq, sealed_at, erased_at]
      # R14: the export lease and chain:reseed's repoint. Never seq,
      # entry_hash or version. SELECT is table-level: the R19 lease take
      # (WHERE export_lease_until IS NULL OR < now()) and its RETURNING seq,
      # entry_hash, the R20 head_seq and head_hash, need it (P5-40a,
      # TICK-612; pinned by TestP540aExportLeaseAndHeadRead).
      audit_chain_head:
        SELECT: []
        UPDATE: [export_lease_until, next_seal_outbox_id, next_seal_at]
      # D-5-3: the pipeline's idempotency keys, insert-only.
      record_write_keys: { SELECT: [], INSERT: [] }
      # The A5 start key (P3-12): claimed once, never changed or removed.
      cascade_start: { SELECT: [], INSERT: [] }
      # The one numbering upsert (D-3-9): INSERT ... ON CONFLICT DO UPDATE SET next.
      # scope_key and period_end (ADR-005, TICK-665) are set by the INSERT arm only; UPDATE stays next.
      record_counters: { SELECT: [], INSERT: [], UPDATE: [next] }
      # INSERT ... RETURNING id and the dedupe-conflict lookup (T29).
      outbox: { SELECT: [tenant_id, id, dedupe_key], INSERT: [] }
      workflow_ref: { SELECT: [], INSERT: [] }
      # lease_until: a takeover extends the lease of its own tenant's abandoned row (T22a, 00006).
      # response_headers: the allow-listed headers a replay restores (TICK-412).
      idempotency_keys: { SELECT: [], INSERT: [], UPDATE: [state, response_status, response_body, lease_until, response_headers] }
      # Tenant resolution (A.1 step 3, T17) and the principal's groups.
      principals: { SELECT: [] }
      groups: { SELECT: [] }
      group_members: { SELECT: [] }
      org_units: { SELECT: [] }
      # Keycloak Registry.TenantOwnsEmailDomain (T18a).
      tenant_email_domain: { SELECT: [] }
      # authz.RequireTenantAdmin (P3-04): the platform id of the tenant's admins group.
      tenant_admin_group: { SELECT: [] }
      # authz.RequireAuditPermission (P5-18): the platform id of the auditors group.
      tenant_auditor_group: { SELECT: [] }
      # Entity types (P3-02, TICK-340). A type's key and number_prefix are set
      # once; publishing moves current_version. numbering_mode (D-3-9, TICK-659)
      # changes later through SetNumberingMode. A version is insert-only (D-3-4).
      entity_definitions: { SELECT: [], INSERT: [], UPDATE: [current_version, updated_at, numbering_mode] }
      entity_definition_versions: { SELECT: [], INSERT: [] }
      # ACLs and shares (P3-30, TICK-615): immutable, insert-only.
      acl_versions: { SELECT: [], INSERT: [] }
      record_shares: { SELECT: [], INSERT: [] }
      # Number formats (P6-06, TICK-671, ADR-005 §3.7 C9): key is set once,
      # publishing moves current_version. Versions and epochs are insert-only.
      number_formats: { SELECT: [], INSERT: [], UPDATE: [current_version, updated_at] }
      number_format_versions: { SELECT: [], INSERT: [] }
      numbering_epochs: { SELECT: [], INSERT: [] }
    # TICK-629: acl_versions' rules and masks CHECKs call these, as the
    # inserting role.
    functions:
      "public.acl_uuids_valid(jsonb)": [EXECUTE]
      "public.acl_subject_valid(jsonb)": [EXECUTE]
      "public.acl_cond_valid(jsonb)": [EXECUTE]
      "public.acl_rules_valid(jsonb)": [EXECUTE]
      "public.acl_masks_valid(jsonb)": [EXECUTE]

  # ADR-004-A1 A1-1 (TICK-558): the masking reader's own login, held only by
  # internal/audit/read's pool (read.OpenPool, NAVA_AUDIT_READER_DATABASE_URL,
  # nava-core only). The one runtime role that reads audit_log.diff and
  # diff_salt; never txid. It reads entity_definition_versions for the
  # masker's secret pointers. A member of nothing, owns nothing, writes
  # nothing, nothing on records or on any partition. Its rows come from
  # audit_log_select and entity_definition_versions_select under the
  # canonical predicate (20261104133000_audit_reader_policies.sql). PgBouncer
  # caps it at pool_size=5 (A1-8).
  nava_audit_reader:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      # It also serves the export's chain columns (P5-40a, TICK-612): the
      # export pages run on this pool (A1-5); the R20 anchor and stub lines
      # carry prev_hash and entry_hash for every seq in range, and full entry
      # lines carry erasure_ref (audit-export-v1 §2). None is content or a
      # secret.
      audit_log:
        SELECT: [tenant_id, id, occurred_at, domain, action, subject_type, subject_id, entity_definition_id,
                 version_before, version_after, actor_principal_id, actor_system, source, source_ref,
                 change_set_id, causation_id, causation_depth, request_id, backfilled, content_sha256,
                 diff_sha256, diff_truncated, diff, diff_salt, seq, prev_hash, entry_hash, sealed_at, erased_at, erasure_ref]
      # tenant_id as well as the masker's two columns: CI-2 (ADR-001) needs every
      # role that reads a tenant table's rows to read its tenant_id, so a row of
      # another tenant can be told apart.
      entity_definition_versions: { SELECT: [tenant_id, definition_id, schema] }

  # As nava_app, without idempotency_keys or tenants; the final activity
  # closes workflow_ref.
  nava_worker:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      records:
        SELECT: []
        INSERT: []
        UPDATE: [version, schema_version, state, requester_id, assignee_id, assignment_group_id,
                 updated_at, data, causation_origin_id, causation_depth]
      # ADR-004: the sealer. It reads every column but diff and diff_salt
      # (the envelope holds diff_sha256) and updates only the seal columns,
      # through the R11 seal transition. As a record writer its R10 INSERT
      # (and the commit-check SELECT, a subset of this one) is generated from
      # db/audited-tables.yaml (R12, P5-11).
      audit_log:
        SELECT: [tenant_id, id, occurred_at, txid, domain, action, subject_type, subject_id, entity_definition_id,
                 version_before, version_after, actor_principal_id, actor_system, source, source_ref,
                 change_set_id, causation_id, causation_depth, request_id, backfilled, content_sha256,
                 diff_sha256, diff_truncated, seq, prev_hash, entry_hash, sealed_at, erased_at, erasure_ref]
        UPDATE: [seq, prev_hash, entry_hash, sealed_at]
      # R14: the sealer's columns. Never export_lease_until.
      audit_chain_head:
        SELECT: []
        UPDATE: [version, seq, entry_hash, next_seal_outbox_id, next_seal_at, seal_interval_s]
      record_write_keys: { SELECT: [], INSERT: [] }
      cascade_start: { SELECT: [], INSERT: [] }
      record_counters: { SELECT: [], INSERT: [], UPDATE: [next] }
      outbox: { SELECT: [tenant_id, id, dedupe_key], INSERT: [] }
      workflow_ref: { SELECT: [], INSERT: [], UPDATE: [closed_at] }
      tenant_admin_group: { SELECT: [] }
      tenant_auditor_group: { SELECT: [] }
      entity_definitions: { SELECT: [] }
      entity_definition_versions: { SELECT: [] }
      # P6-06 (TICK-671, C9): reads only.
      number_formats: { SELECT: [] }
      number_format_versions: { SELECT: [] }
      numbering_epochs: { SELECT: [] }
      acl_versions: { SELECT: [], INSERT: [] }
      record_shares: { SELECT: [], INSERT: [] }
    # TICK-629: acl_versions' rules and masks CHECKs call these, as the
    # inserting role.
    functions:
      "public.acl_uuids_valid(jsonb)": [EXECUTE]
      "public.acl_subject_valid(jsonb)": [EXECUTE]
      "public.acl_cond_valid(jsonb)": [EXECUTE]
      "public.acl_rules_valid(jsonb)": [EXECUTE]
      "public.acl_masks_valid(jsonb)": [EXECUTE]

  # Every column of outbox but dedupe_key and last_error; writes only the
  # dispatch columns. Nothing on workflow_ref or records.
  nava_relay:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      outbox:
        SELECT: [id, tenant_id, kind, kind_version, target_key, target_seq, causation_id, causation_depth,
                 payload, trace_context, created_at, available_at, attempts, dispatched_at, dead_at]
        UPDATE: [available_at, attempts, last_error, dispatched_at, dead_at]

  # DELETE plus SELECT on the key and expiry-predicate columns, behind the
  # paired purge policies; and the dead-lineage gauge's read (TICK-590).
  nava_purge:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      outbox: { SELECT: [tenant_id, id, dispatched_at, dead_at], DELETE: [] }
      workflow_ref: { SELECT: [tenant_id, outbox_id, closed_at], DELETE: [] }
      idempotency_keys: { SELECT: [tenant_id, principal_id, key, expires_at], DELETE: [] }
      # P5-34f (TICK-590, ADR-004 R17): the dead-lineage gauge reads the key
      # and R17's column behind audit_chain_head_purge_select, whose USING is
      # R17's predicate: only dead heads, never written.
      audit_chain_head: { SELECT: [tenant_id, next_seal_at] }
      # P6-10 (TICK-675, ADR-005 §4.3): the key and period_end of period
      # counters past the 2-day grace, under record_counters_purge_select and
      # record_counters_purge. Never next. The batch DELETE needs the key, as
      # outbox and idempotency_keys do; a DELETE by ctid would need SELECT on
      # the whole table.
      record_counters: { SELECT: [tenant_id, entity_definition_id, scope_key, period_end], DELETE: [] }

  # Creates its own tenant (provisioning), binds it, activates it.
  nava_onboard:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenants: { SELECT: [id, state, onboarding_request_hash, created_at], INSERT: [id, state, onboarding_request_hash], UPDATE: [state] }
      tenant_identity_binding: { INSERT: [tenant_id, issuer, org_id, idp_aliases] }
      # T18a claims domains next to the binding; TICK-280 releases a
      # provisioning tenant's (DELETE ... WHERE tenant_id = $1).
      tenant_email_domain: { SELECT: [tenant_id], INSERT: [tenant_id, domain], DELETE: [] }
      # InviteUser's insert and re-invite upsert (T252a): SELECT for the
      # conflict target, the DO UPDATE WHERE and EXCLUDED.expires_at; UPDATE
      # only expires_at, so a consumed invite cannot be reopened.
      pending_invite: { SELECT: [tenant_id, email, expires_at, consumed_at], INSERT: [tenant_id, email, expires_at], UPDATE: [expires_at] }
      # P3-04: the admins group row (platform id minted here, Keycloak id from
      # DirectoryAdmin) and the tenant's pointer to it. Insert only.
      # ADR-004-E5 D4 (TICK-536): RecordAdminGroup/RecordAuditorGroup filter deleted_at IS NULL, so they read it.
      groups: { SELECT: [tenant_id, id, keycloak_group_id, deleted_at], INSERT: [tenant_id, id, keycloak_group_id, path] }
      # Activate tests the row exists (TICK-373): SELECT on the key only.
      tenant_admin_group: { SELECT: [tenant_id], INSERT: [tenant_id, group_id] }
      # P5-23 (TICK-568): SELECT on the key, for the groups_insert_onboard_
      # auditors probe and the upgrade reconcile's no-op check. Insert only.
      tenant_auditor_group: { SELECT: [tenant_id], INSERT: [tenant_id, group_id] }
      # Seed templates (P3-06) while provisioning, with deterministic UUIDv5
      # ids, so a plain INSERT is enough: no SELECT, no upsert (P3-02).
      entity_definitions: { INSERT: [] }
      entity_definition_versions: { INSERT: [] }
      # P5-33 (TICK-441, ADR-001-A6.2): the chain head and the first
      # audit.seal start row, plain INSERT only (no SELECT, no RETURNING, no
      # DO UPDATE), behind pinned provisioning policies; the outbox policy
      # also requires kind = 'audit.seal'. Columns equal outbox.insertSealSQL.
      audit_chain_head: { INSERT: [tenant_id, id, next_seal_outbox_id, next_seal_at] }
      outbox: { INSERT: [id, tenant_id, kind, kind_version, dedupe_key, target_key, target_seq, causation_id, causation_depth, payload, trace_context] }

  # ADR-001-A6.1 (P5-10b): the one-shot erasure job (Epic 30), one run per
  # erasure request with app.tenant_id set, under canonical policies only.
  # LOGIN, a member of nothing, owns nothing, not on PgBouncer: its
  # credential lives with the job runner, like the migrator's, never on an
  # app or worker host. On audit_log (R23): SELECT by column and never diff
  # or diff_salt; INSERT on the R10 columns for its audit/erase entries;
  # UPDATE of the four erase columns, which the R11 erase transition is the
  # only way to use. Epic 30 adds its record-table grants.
  nava_erasure:
    attributes: [LOGIN]
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      audit_log:
        SELECT: [tenant_id, occurred_at, id, subject_type, subject_id, erased_at, erasure_ref]
        INSERT: [tenant_id, id, domain, action, subject_type, subject_id, entity_definition_id,
                 version_before, version_after, actor_principal_id, actor_system, source, source_ref,
                 change_set_id, causation_id, causation_depth, request_id, content_sha256, diff_sha256,
                 diff_truncated, diff, diff_salt]
        UPDATE: [diff, diff_salt, erased_at, erasure_ref]

  # Writes the identity tables (T16), one transaction per tenant. UPDATE
  # leaves the keys alone. A group is never deleted, only tombstoned
  # (ADR-004-E5). group_members is insert and delete only.
  nava_groupsync:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenant_identity_binding: { SELECT: [tenant_id, issuer, org_id, idp_aliases] } # binding_lookup
      principals: { SELECT: [], INSERT: [], UPDATE: [email, enabled, federated_links, synced_at, deleted_at] }
      # ADR-004-E5 (TICK-534): sync tombstones a group (deleted_at) and
      # revives it on the same id; never UPDATE id or keycloak_group_id, and
      # no DELETE (step (ii), TICK-538; D2, D10).
      groups: { SELECT: [], INSERT: [], UPDATE: [path, deleted_at] }
      group_members: { SELECT: [], INSERT: [], DELETE: [] }
      org_units: { SELECT: [], INSERT: [], UPDATE: [parent_id, name], DELETE: [] }
      # Group sync reads the recorded admins and auditors groups (P3-04, I1)
      # and deletes a pointer only once its group is tombstoned (ADR-004-E5
      # D5: tenant_admin_group_delete_tombstoned and
      # tenant_auditor_group_delete_tombstoned).
      tenant_admin_group: { SELECT: [], DELETE: [] }
      tenant_auditor_group: { SELECT: [tenant_id, group_id], DELETE: [] }
      # Consumes an invite (T252a): UPDATE ... SET consumed_at = now() WHERE
      # ... consumed_at IS NULL AND expires_at > now() RETURNING. No DELETE.
      pending_invite: { SELECT: [tenant_id, email, expires_at, consumed_at], UPDATE: [consumed_at] }

  # Physical backups only. No CONNECT on the platform database; db/pg_hba.conf
  # lets it in only as a physical walsender from the backup host and rejects
  # every SQL session and logical walsender (A.3, R2).
  nava_backup:
    attributes: [LOGIN, REPLICATION]

  # Own databases; nothing on the platform database (A.3).
  keycloak:
    attributes: [LOGIN]
  temporal:
    attributes: [LOGIN]

  # PgBouncer's auth_user. Logs in from PgBouncer's auth_file, not through the
  # lookup, so it is not on the allow-list.
  pgbouncer_auth:
    attributes: [LOGIN]
    database: [CONNECT]
    schemas: { pgbouncer: [USAGE] }
    functions: { "pgbouncer.get_auth(text)": [EXECUTE] }

# Objects that break an I3 rule on purpose. Each is owned by the bootstrap
# superuser, created and converged by db-roles (not by the migrator), and
# reachable only by `granted_to`, whose role entries must list it.
infrastructure_exceptions:
  pgbouncer_get_auth:
    schema: pgbouncer
    function: pgbouncer.get_auth(text)
    security_definer: true
    granted_to: [pgbouncer_auth]
    reason: >-
      PgBouncer's auth_query reads pg_shadow, which only a superuser can. The
      function returns a row only for roles with pgbouncer_login: true, and
      never for a superuser, BYPASSRLS or REPLICATION role.

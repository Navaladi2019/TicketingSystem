# The single grant manifest (ADR-001 I3, A.3; PLAN-001 D-P2). Nothing else
# grants privileges. Read by two jobs through internal/platform/strictyaml
# (unknown keys, duplicate keys and a second document are errors):
#
#   db-roles (bootstrap superuser): creates or alters every role under `roles`
#     (always NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS, plus the listed
#     `attributes`), revokes every role membership this file does not list
#     (it lists none), creates `databases` with their owners, and converges the
#     `infrastructure_exceptions`.
#   migrate (nava_migrator, after the migrations): grants on the platform
#     database what each role lists below, and revokes and logs anything else
#     granted on an object nava_migrator owns, PUBLIC included.
#
# Per role:
#   attributes:      LOGIN and/or REPLICATION; anything not listed is off.
#   pgbouncer_login: true puts the role on PgBouncer's login allow-list.
#   database:        privileges on the platform database (CONNECT, TEMPORARY, CREATE).
#   schemas:         schema -> privileges (USAGE, CREATE).
#   tables:          table -> privilege -> columns. An empty list is a
#                    table-level grant; a list grants only those columns.
#                    A bare name is in schema public.
#   functions:       "schema.name(argtypes)" -> [EXECUTE].
# Each table's entries ship with the migration that creates that table.
# Policies stay in SQL migrations.

platform_database: nava

databases:
  nava: { owner: nava_migrator }
  keycloak: { owner: keycloak }
  temporal: { owner: temporal }
  temporal_visibility: { owner: temporal }

roles:
  # Owns every platform object and the database (datdba); granted to no one;
  # connects directly to PostgreSQL, never through PgBouncer.
  nava_migrator:
    attributes: [LOGIN]

  # The D28 system actors (A.3), one role each. Table entries: T09
  # (00002_platform_tables.sql), T16 (00003_identity_tables.sql) and T18a
  # (00004_tenant_email_domain.sql). Every
  # tenant table is under FORCE RLS, so a grant here reaches only the rows its
  # policies allow.
  nava_app:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenants: { SELECT: [id, state] }
      tenant_identity_binding: { SELECT: [tenant_id, issuer, org_id, idp_aliases] } # binding_lookup
      records: { SELECT: [], INSERT: [], UPDATE: [version] }
      # INSERT ... RETURNING id and the dedupe-conflict lookup (T29).
      outbox: { SELECT: [tenant_id, id, dedupe_key], INSERT: [] }
      workflow_ref: { SELECT: [], INSERT: [] }
      idempotency_keys: { SELECT: [], INSERT: [], UPDATE: [state, response_status, response_body] }
      # Tenant resolution (A.1 step 3, T17) and the principal's groups.
      principals: { SELECT: [] }
      groups: { SELECT: [] }
      group_members: { SELECT: [] }
      org_units: { SELECT: [] }
      # Keycloak Registry.TenantOwnsEmailDomain (T18a).
      tenant_email_domain: { SELECT: [] }
    functions: {}

  # As nava_app, without idempotency_keys or tenants; the final activity
  # closes workflow_ref.
  nava_worker:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      records: { SELECT: [], INSERT: [], UPDATE: [version] }
      outbox: { SELECT: [tenant_id, id, dedupe_key], INSERT: [] }
      workflow_ref: { SELECT: [], INSERT: [], UPDATE: [closed_at] }

  # Every column of outbox but dedupe_key and last_error; writes only the
  # dispatch columns. Nothing on workflow_ref or records.
  nava_relay:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      outbox:
        SELECT: [id, tenant_id, kind, kind_version, target_key, target_seq, causation_id, causation_depth,
                 payload, trace_context, created_at, available_at, attempts, dispatched_at, dead_at]
        UPDATE: [available_at, attempts, last_error, dispatched_at, dead_at]

  # DELETE plus SELECT on the key and expiry-predicate columns, behind the
  # paired purge policies.
  nava_purge:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      outbox: { SELECT: [tenant_id, id, dispatched_at, dead_at], DELETE: [] }
      workflow_ref: { SELECT: [tenant_id, outbox_id, closed_at], DELETE: [] }
      idempotency_keys: { SELECT: [tenant_id, principal_id, key, expires_at], DELETE: [] }

  # Creates its own tenant (provisioning), binds it, activates it.
  nava_onboard:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenants: { SELECT: [id, state, onboarding_request_hash, created_at], INSERT: [id, state, onboarding_request_hash], UPDATE: [state] }
      tenant_identity_binding: { INSERT: [tenant_id, issuer, org_id, idp_aliases] }
      tenant_email_domain: { INSERT: [tenant_id, domain] } # T18a, next to the binding

  # Writes the identity tables (T16), one transaction per tenant. UPDATE
  # leaves the keys alone: a row is re-keyed by delete and insert, never in
  # place. group_members is insert and delete only.
  nava_groupsync:
    attributes: [LOGIN]
    pgbouncer_login: true
    database: [CONNECT]
    schemas: { public: [USAGE] }
    tables:
      tenant_identity_binding: { SELECT: [tenant_id, issuer, org_id, idp_aliases] } # binding_lookup
      principals: { SELECT: [], INSERT: [], UPDATE: [email, enabled, federated_links, synced_at, deleted_at], DELETE: [] }
      groups: { SELECT: [], INSERT: [], UPDATE: [path], DELETE: [] }
      group_members: { SELECT: [], INSERT: [], DELETE: [] }
      org_units: { SELECT: [], INSERT: [], UPDATE: [parent_id, name], DELETE: [] }

  # Physical backups only. No CONNECT on the platform database; db/pg_hba.conf
  # lets it in only as a physical walsender from the backup host and rejects
  # every SQL session and logical walsender (A.3, R2).
  nava_backup:
    attributes: [LOGIN, REPLICATION]

  # Own databases; nothing on the platform database (A.3).
  keycloak:
    attributes: [LOGIN]
  temporal:
    attributes: [LOGIN]

  # PgBouncer's auth_user. Logs in from PgBouncer's auth_file, not through the
  # lookup, so it is not on the allow-list.
  pgbouncer_auth:
    attributes: [LOGIN]
    database: [CONNECT]
    schemas: { pgbouncer: [USAGE] }
    functions: { "pgbouncer.get_auth(text)": [EXECUTE] }

# Objects that break an I3 rule on purpose. Each is owned by the bootstrap
# superuser, created and converged by db-roles (not by the migrator), and
# reachable only by `granted_to`, whose role entries must list it.
infrastructure_exceptions:
  pgbouncer_get_auth:
    schema: pgbouncer
    function: pgbouncer.get_auth(text)
    security_definer: true
    granted_to: [pgbouncer_auth]
    reason: >-
      PgBouncer's auth_query reads pg_shadow, which only a superuser can. The
      function returns a row only for roles with pgbouncer_login: true, and
      never for a superuser, BYPASSRLS or REPLICATION role.

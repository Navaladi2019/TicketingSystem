# PostgreSQL client authentication for the compose stack (ADR-001 A.3, R2;
# T02 security review). Mounted read-only into the postgres container and
# selected with `-c hba_file=` (compose.yaml); it replaces the image's file,
# which trusts the local socket and lets every role in from any address.
#
# PostgreSQL uses the FIRST line that matches the connection type, database,
# user and address, so every reject sits above the catch-all lines. `all`
# under DATABASE does not match a physical replication connection; only the
# `replication` keyword does. A logical walsender (replication=database)
# names a database and so matches `all`.
#
# <backup-host> is 127.0.0.1/32: in the compose stack a physical backup runs
# inside the postgres container (pg_basebackup -h 127.0.0.1 -U nava_backup).
# A deployment with a backup host replaces that address and nothing else.
#
# db/pg_hba_test.go checks these rules line by line; stack-test.sh hba
# checks them against the running stack.

# TYPE  DATABASE     USER         ADDRESS        METHOD

# The bootstrap superuser: only over the Unix socket, which only the postgres
# and db-roles containers mount. Never over TCP, from any container.
local   all          pgadmin                     scram-sha-256
host    all          pgadmin      0.0.0.0/0      reject
host    all          pgadmin      ::/0           reject

# Backups: a physical walsender from the backup host, nothing else.
host    replication  nava_backup  127.0.0.1/32   scram-sha-256
host    all          nava_backup  0.0.0.0/0      reject
host    all          nava_backup  ::/0           reject
local   all          nava_backup                 reject

# Catch-all: every other role, password (SCRAM) only. No physical replication
# for anyone else: no `replication` line follows.
local   all          all                         scram-sha-256
host    all          all          0.0.0.0/0      scram-sha-256
host    all          all          ::/0           scram-sha-256

# PLAN-001 D-P10: paths that need a Security reviewer on top of the squad's
# normal reviewer, plus an adversarial test. `make review-paths` (CI, every
# pull request) prints two lines on the PR's checks summary:
#
#   security review required: yes|no   any changed file matches `security`
#   CTO sign-off required: yes|no      a `cto_signoff.paths` file changed, or a
#                                      registered isolation test was removed
#                                      or gained a skip
#
# Patterns: a trailing `/` matches everything under that directory; a leading
# `**/` matches the rest at any depth (`**/*isolation*_test.go`); anything else
# is a path.Match glob against the whole repo-relative path.
#
# Several packages below do not exist yet. Their paths are the names PLAN-001
# gives them, written as `- path: <pattern>` with `planned: "PLAN-001 T<nn>"`,
# the task that creates them. The task that creates one updates this file in
# the same PR: it drops the marker, or fixes the path if the package got
# another name (and that PR is itself flagged, since this file is on the
# list). TestPathsMatchTrackedFiles (tools/ci/reviewpaths) fails on an entry
# of `security` or `cto_signoff.paths` that matches no tracked file and has no
# marker, on a marker that names no task, and on a marker whose path exists.

security:
  - internal/tenancy/
  - internal/identity/
  - internal/outbox/
  # The relay and the worker guard.
  - internal/relay/
  - path: cmd/nava-relay/
    planned: "PLAN-001 T30b"
  - internal/workerguard/
  # The auth middleware.
  - path: internal/platform/auth/
    planned: "PLAN-001 T17"
  # Cursor and idempotency.
  - internal/platform/cursor/
  - path: internal/platform/idempotency/
    planned: "PLAN-001 T22"
  - cmd/nava-purge/
  - path: cmd/nava-groupsync/
    planned: "PLAN-001 T25"
  # The operator onboarding handler.
  - path: internal/onboarding/
    planned: "PLAN-001 T21"
  - temporal-server/
  # Including pg_hba.conf, grants.yaml and every migration.
  - db/
  - cmd/nava-db/
  - internal/db/
  # The realm export and the Keycloak image build (here since TICK-57).
  - deploy/compose/keycloak/
  # The compose network files.
  - compose.yaml
  - deploy/compose/compose.internal.yaml
  # The CI workflow and what it runs.
  - .github/
  - Makefile
  - tools/ci/
  - docs/delivery/review-paths.yaml
  # The `set_config` lint config (and every other lint rule).
  - .golangci.yml
  - tools/navalint/
  # Span export filter and outbound redaction (TICK-93 audit).
  - internal/platform/telemetry/

cto_signoff:
  # Editing any of these needs CTO sign-off.
  paths:
    # The isolation registry. T11 built it in Go; there is no YAML form.
    - internal/tenancy/isolation/registry.go
    # The RLS allow-list (ADR-001 A.3, CI-1). T09 pinned it in Go; T10 moved
    # it into the catalogue gate, which enforces it after every migrator run.
    - internal/db/catalog/policy.go
    # Tenant tables are every platform table not listed here (D-P16).
    - db/global-tables.yaml
  # Registered isolation tests: removing one of these files, adding a
  # t.Skip / t.SkipNow / t.Skipf / testing.Short() guard to one, or adding or
  # changing a build constraint (`//go:build ignore` and the like) that can
  # leave it out of the run, needs CTO sign-off.
  isolation_tests:
    - "**/*isolation*_test.go"
    - internal/tenancy/isolation/*_test.go
    # The T27a CI-6 namespace-isolation suite.
    - temporal-server/authz/adversarial_test.go

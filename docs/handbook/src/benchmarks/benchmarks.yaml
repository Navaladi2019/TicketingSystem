# Handbook section 8: each budget next to its latest result of record (TICK-731).
#
# One row per (budget, host class). Every row of docs/budgets.md is named by at
# least one row's budgets_md, verbatim; the build fails when one is missing or
# when budgets_md names a row that is gone. Rows with no budgets_md are the
# P3-36 list and read targets and the budgets that live outside budgets.md.
#
# Keys: group, budget, budgets_md, threshold, result, date, commit, host,
# verdict (met | warn | waived | known miss | no result yet), source
# (path#heading-id, checked), run (GitHub Actions run link), decision and
# decision_label (required for waived and known miss), note.
#
# Never guess. A result with no recorded commit says commit: not recorded.
# A budget with no committed result says verdict: no result yet. Nothing is
# fetched at build time: run links are plain links. Update a row in the same
# change that records a new result in its source.

rows:

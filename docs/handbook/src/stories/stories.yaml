# Story manifest (contract C-HB-1, schema extended by TICK-725).
#
# stories: one entry per story.
#   id, issue (TICK-nn), title, status (delivered | in-progress | planned)
#   verdict + date (ISO): required when delivered. verdict normalised to READY
#     from the kit's result or the story's ACCEPTED comment; date from the kit's
#     verified line, else the commit that recorded the run. verdict_comment is
#     link text only.
#   bruno: folder names under docs/acceptance/guide/bruno/ (list; a bare string is accepted)
#   evidence: repo paths, at least one when delivered. Committed files only,
#     never a GitHub Actions run URL.
# unassigned: cross-cutting folders and kits that belong to no single story,
#   each {path, reason}.
#
# Status was re-checked on 2026-11-12 against the issue and origin/main:
# delivered = issue done and its story branch merged to main; in-progress =
# story branch exists and is not on main; planned = no branch yet.

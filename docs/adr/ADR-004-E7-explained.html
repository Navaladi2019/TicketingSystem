<h1>The audit sealer should speed up as soon as there is work, not one run later</h1>

<blockquote><strong>In one sentence.</strong> After a quiet period, the background job that seals audit entries waited one extra slow cycle (up to 5 minutes) before going fast. With a large burst that meant up to about 10 minutes, which can set off an alarm on a healthy system. We fix the code so the job checks for waiting work before it books its next run, and we reword the rule (R16) to say exactly who does what.</blockquote>

<h2>Words used here</h2>
<dl>
<dt>Sealing</dt><dd>Giving each audit entry its place in a tamper-evident hash chain (a numbered sequence, <code>seq</code>, where each entry's fingerprint depends on the one before). Entries are readable before they are sealed. Sealing is what makes later tampering detectable.</dd>
<dt>Run, A1, A2</dt><dd>The sealer is a recurring background job; each occurrence is a <em>run</em>. A run has two steps. <strong>A1</strong> books the next run. <strong>A2</strong> then seals up to 10,000 waiting entries.</dd>
<dt>Interval</dt><dd>How long until the next run: 10 seconds when busy, doubling to at most 300 seconds (5 minutes) when quiet. It is stored on the tenant's chain record (<code>seal_interval_s</code>).</dd>
<dt>Lineage</dt><dd>The unbroken series of runs for one tenant. If it ever stops, an operator has to restart it (<code>chain:reseed</code>).</dd>
<dt>Poison entry</dt><dd>An entry that cannot be sealed. Every run fails on it until someone fixes it.</dd>
<dt>Temporal determinism</dt><dd>Our workflow engine re-plays a job's recorded history to recover it after a crash. The job's control logic must therefore make the same decisions on replay. Changes inside a step (an "activity") are safe; changes to the order of steps are not.</dd>
</dl>

<h2>The problem</h2>
<p>A1 books the next run <em>before</em> A2 works. That order is deliberate: if A2 crashes or hits a poison entry, the next run is already booked and the lineage never stops. But A1 used the interval that the <em>previous</em> run's A2 left behind. After a quiet period that is 300 s, even when work has just arrived.</p>

<h2>Options considered</h2>
<table><tr><th>Option</th><th>Verdict</th><th>Why</th></tr>
<tr><td>Keep the code; reword the rule and accept about 10 minutes after a quiet period</td><td class="bad">Rejected</td><td>Weakens a promise we made (≤ 5 min after quiet) and makes the 10-minute alarm fire on a healthy system</td></tr>
<tr><td>Run A2 before A1</td><td class="bad">Rejected</td><td>A crash or poison entry in A2 would stop the lineage for good until an operator steps in</td></tr>
<tr><td><strong>A1 checks for waiting entries and books 10 s if there are any</strong></td><td class="good">Chosen</td><td>Restores the promise, keeps the crash safety, needs no new database permission and no workflow change</td></tr></table>

<h2>The fix</h2>
<ul>
<li>In A1, under the tenant's chain lock, one quick indexed check: are there unsealed entries? If so, book the next run at 10 s and store 10 s. If not, keep today's behaviour.</li>
<li>Only the code inside step A1 changes, so recorded job histories still replay (determinism holds). A repeated A1 still does nothing the second time (idempotent).</li>
<li>Tests: a big burst after a quiet period books the next run at about 10 s (fails today, passes after the fix); a poison entry gives 10-second retries without breaking the lineage; the S15 acceptance kit is updated to expect fast sealing after quiet.</li>
<li>The architecture note <code>docs/architecture/audit-sealer.md</code> is corrected alongside.</li>
</ul>

<h2>What we accept</h2>
<ul>
<li>One extra small database check per run, about 3.3 per second for every 1,000 quiet tenants.</li>
<li>A tenant stuck on a poison entry is retried every 10 s, the same as an active tenant with poison today. The failure counter and alarm already cover it.</li>
<li>An entry written just after a run finished still waits for the run already booked (at most 5 minutes). That is the documented bound.</li>
</ul>

<h2>Evidence</h2>
<ul>
<li>Observed in the S15 acceptance kit: the second write after a quiet period was sealed after 160 s instead of about 10 s.</li>
<li>Code reading by the Technical Architect, who confirmed the roughly 600 s case for bursts above 10,000 entries directly from the source. No spike was needed, because the chosen option removes the case.</li>
</ul>

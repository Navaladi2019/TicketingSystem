; Transaction pooling, as docs/pins.md and ADR-001 require.
[databases]
spike = host=pg port=5432 dbname=spike

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits

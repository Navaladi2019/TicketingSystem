<span class="pill" id="status">PROPOSED · 2026-11-28</span> <span class="src">ADR-009-E1 · issue TICK-915 (S29) · amends ADR-009 D13 · source: TICK-754 S29 acceptance kit, criterion 4</span>

<h1>A unique field with a default is refused with <code>invalid_definition</code></h1>

<blockquote><strong>In three sentences.</strong>
(1) ADR-009 says that publishing a record type where a unique field has a default value is refused, and names the error code <code>invalid_schema</code>.
(2) That code was never registered; the platform answers every rejected record-type definition with <code>invalid_definition</code>, and the code that was built does exactly that.
(3) We correct the document, not the code: the refusal, the 422 status and "nothing is stored" all stay as decided.</blockquote>

<h2>1. The problem in plain words</h2>
<p>A <em>record type</em> (for example "incident") is defined by a JSON Schema that a tenant admin publishes. A field marked <code>x-nava-unique</code> must hold a different value on every record. ADR-009 decision D13 forbids giving such a field a <em>default</em> (a value filled in when none is given), because the background backfill would then write the same value into every old record and break uniqueness.</p>
<p>When a publish is refused, the response carries an <em>error code</em>: a fixed machine-readable string that client programs check to decide what to do. The platform keeps one list of these codes, the <em>error catalogue</em> (<code>api/errors.yaml</code>). D13 named a code, <code>invalid_schema</code>, that is not in the catalogue. The implementation used the catalogue's code for this whole family of mistakes, <code>invalid_definition</code>. The S29 acceptance test followed the document and failed on that one string, although the behaviour was right.</p>

<h2>2. Options considered</h2>
<table><tr><th>Option</th><th>Effect</th><th>Verdict</th></tr>
<tr><td>Correct the document to <code>invalid_definition</code></td><td>Text change only. One code for every rejected definition; the <code>errors[].pointer</code> field already says which rule failed (here <code>/definition/schema/properties/&lt;name&gt;/default</code>).</td><td class="good">Chosen</td></tr>
<tr><td>Register <code>invalid_schema</code> and change the code</td><td>A new catalogue entry used by one rule; clients must handle two codes for the same kind of mistake; code change, regenerated catalogue and a kit rerun.</td><td class="bad">Rejected</td></tr>
<tr><td>Keep both names as aliases</td><td>Two names for one thing; the catalogue, <code>problem.go</code> and the test registry would drift apart.</td><td class="bad">Rejected</td></tr></table>

<h2>3. The decision</h2>
<ul>
<li><b>E1-1</b> D13 reads: refused with 422 <code>invalid_definition</code>, pointer <code>/definition/schema/properties/&lt;name&gt;/default</code>, rule <code>invalid</code>.</li>
<li><b>E1-2</b> The publish test scenario, RFC-021 D13 and CI-9 read the same way; creating a type with the pair is refused the same way.</li>
<li><b>E1-3</b> S29 acceptance criterion 4 reads <code>invalid_definition</code>; the kit asserts it. No code change.</li>
<li><b>E1-4</b> <code>invalid_schema</code> is not added to the catalogue.</li>
</ul>

<h2>4. Fix and migration</h2>
<p>None in code. Nothing ever answered <code>invalid_schema</code>, so no client can depend on it. The story text, the S29 kit and the handbook page are updated to the corrected code.</p>

<h2>5. What is being accepted</h2>
<p>No residual risk. The refusal still exposes no field value (only a pointer and a rule), and tenant isolation is untouched. No row in the accepted-risks register.</p>

<h2>6. Evidence</h2>
<ul>
<li>Catalogue: <code>api/errors.yaml</code> registers <code>invalid_definition</code> (422, "Invalid entity definition"); <code>invalid_schema</code> appears nowhere in code.</li>
<li>Implementation: <code>metadata.CompileNew</code> (TICK-919, PR #932) and its unit test.</li>
<li>Fresh-stack run, 2026-11-27 (S29 kit, request S29.5): <code>422</code>, <code>code: invalid_definition</code>, pointer <code>/definition/schema/properties/s29_tier/default</code>; S29.8 shows the type still at its previous version, so nothing was stored. Red only on the string; green once the kit asserts the corrected code.</li>
</ul>

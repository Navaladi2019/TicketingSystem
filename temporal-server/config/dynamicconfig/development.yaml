# Dynamic config for the development image.
# D6-K (ADR-001 A1, A2): every key below is set explicitly to its shipped
# value, and checkSecurityConfig refuses to start if any value of one of them,
# per namespace included, is not that value. Every key is false except
# frontend.enableTokenNamespaceEnforcement, which must be true. Only the two
# authorizer keys may be left out; leaving out any other refuses too.
# Keep deploy/compose/temporal/config/dynamicconfig/compose.yaml in step.
system.disableStreamingAuthorizer:
  - value: false
frontend.exposeAuthorizerErrors:
  - value: false
system.enableCrossNamespaceCommands:
  - value: false
worker.enableNamespaceBatcher:
  - value: false
worker.enableScheduler:
  - value: false
frontend.enableSchedules:
  - value: false
frontend.enableBatcher:
  - value: false
frontend.enableTokenNamespaceEnforcement:
  - value: true
